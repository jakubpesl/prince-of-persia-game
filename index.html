      const rotScale = Math.abs(Math.cos(t * 1.5)); // horizontal scale oscillation = rotation illusion
      ctx.save();
      ctx.shadowBlur = 20; ctx.shadowColor = COL.teal;
      ctx.translate(sx + 12, c.y + bob + 12);
      ctx.scale(rotScale * 0.4 + 0.6, 1); // rotate illusion

      // Outer sparkles (4-point stars at corners)
      ctx.strokeStyle = COL.teal; ctx.lineWidth = 0.8;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 4);
      for (let sp = 0; sp < 4; sp++) {
        const sa = (sp / 4) * Math.PI * 2 + t;
        const sr2 = 18;
        const spx = Math.cos(sa) * sr2, spy = Math.sin(sa) * sr2;
        ctx.beginPath();
        ctx.moveTo(spx - 3, spy); ctx.lineTo(spx + 3, spy);
        ctx.moveTo(spx, spy - 3); ctx.lineTo(spx, spy + 3);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // 6-faceted crystal body: top spike, hex middle, bottom spike
      const cGrad = ctx.createRadialGradient(-2, -4, 1, 0, 0, 14);
      cGrad.addColorStop(0, '#ffffff'); cGrad.addColorStop(0.3, COL.teal); cGrad.addColorStop(1, '#005544');
      ctx.fillStyle = cGrad;
      // Top spike
      ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(-5, -10); ctx.lineTo(5, -10); ctx.closePath(); ctx.fill();
      // Hex middle
      ctx.beginPath();
      for (let hi = 0; hi < 6; hi++) {
        const ha = (hi / 6) * Math.PI * 2 - Math.PI/2;
        const hx = Math.cos(ha) * 10, hy = Math.sin(ha) * 8;
        if (hi === 0) ctx.moveTo(hx, hy - 2); else ctx.lineTo(hx, hy);
      }
      ctx.closePath(); ctx.fill();
      // Bottom spike
      ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(-5, 10); ctx.lineTo(5, 10); ctx.closePath(); ctx.fill();

      // Inner bright white core
      const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 6);
      coreGrad.addColorStop(0, 'rgba(255,255,255,0.9)'); coreGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = coreGrad;
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();

      // Refraction lines inside
      ctx.strokeStyle = 'rgba(200,255,240,0.4)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(4, 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2, -10); ctx.lineTo(-3, 8); ctx.stroke();

      ctx.restore();
      // Label
      ctx.fillStyle = '#aaffee'; ctx.font = '10px Georgia';
      ctx.textAlign = 'center'; ctx.fillText('TIME', sx+12, c.y+bob-10);
    }
  }

  drawPortal(camX, t) {
    if (!this.portal) return;
    const p = this.portal;
    const sx = p.x - camX;
    const cx2 = sx + p.w/2, cy2 = p.y + p.h/2;

    ctx.save();

    // Stone archway frame (beveled 3D look)
    ctx.fillStyle = '#2a1a3a';
    ctx.beginPath();
    ctx.moveTo(sx - 14, p.y + p.h + 6);
    ctx.lineTo(sx - 14, p.y + 26);
    ctx.arc(cx2, p.y + 26, p.w/2 + 14, Math.PI, 0);
    ctx.lineTo(sx + p.w + 14, p.y + p.h + 6);
    ctx.lineTo(sx + p.w + 8, p.y + p.h + 6);
    ctx.lineTo(sx + p.w + 8, p.y + 26);
    ctx.arc(cx2, p.y + 26, p.w/2 + 8, 0, Math.PI, true);
    ctx.lineTo(sx - 8, p.y + p.h + 6);
    ctx.closePath(); ctx.fill();
    // Arch highlight
    ctx.strokeStyle = '#5a3a7a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx - 8, p.y + p.h); ctx.lineTo(sx - 8, p.y + 26); ctx.arc(cx2, p.y + 26, p.w/2 + 8, Math.PI, 0); ctx.lineTo(sx + p.w + 8, p.y + p.h); ctx.stroke();
    // Carved geometric pattern along arch border
    ctx.strokeStyle = 'rgba(180,140,0,0.4)'; ctx.lineWidth = 0.8;
    for (let ap = 0; ap < 12; ap++) {
      const aa = Math.PI + (ap / 11) * Math.PI;
      const arx = cx2 + Math.cos(aa) * (p.w/2 + 11);
      const ary = (p.y + 26) + Math.sin(aa) * (p.w/2 + 11);
      ctx.beginPath(); ctx.arc(arx, ary, 3, 0, Math.PI*2); ctx.stroke();
    }

    // Portal glow (golden light 200px radius)
    const pgGrad = ctx.createRadialGradient(cx2, cy2, 5, cx2, cy2, 100);
    pgGrad.addColorStop(0, `rgba(255,215,0,0.35)`);
    pgGrad.addColorStop(0.4, `rgba(100,0,255,0.15)`);
    pgGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = pgGrad;
    ctx.beginPath(); ctx.arc(cx2, cy2, 100, 0, Math.PI*2); ctx.fill();

    // Portal frame
    ctx.strokeStyle = COL.gold; ctx.lineWidth = 4;
    ctx.shadowBlur = 20; ctx.shadowColor = COL.gold;
    ctx.beginPath();
    ctx.moveTo(sx, p.y + p.h);
    ctx.lineTo(sx, p.y + 20);
    ctx.arc(cx2, p.y + 20, p.w/2, Math.PI, 0);
    ctx.lineTo(sx + p.w, p.y + p.h);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Portal interior fill
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(sx + 4, p.y + p.h);
    ctx.lineTo(sx + 4, p.y + 20);
    ctx.arc(cx2, p.y + 20, p.w/2 - 4, Math.PI, 0);
    ctx.lineTo(sx + p.w - 4, p.y + p.h);
    ctx.closePath();
    ctx.clip();

    const pInner = ctx.createRadialGradient(cx2, cy2, 2, cx2, cy2, p.w/2 - 4);
    pInner.addColorStop(0, '#ffffaa');
    pInner.addColorStop(0.3, '#ffaa00');
    pInner.addColorStop(0.6, '#6600ff');
    pInner.addColorStop(1, '#220044');
    ctx.fillStyle = pInner;
    ctx.fillRect(sx, p.y, p.w, p.h);
    ctx.restore();

    // Layer 1: Rotating octagon (t*0.8)
    ctx.save();
    ctx.translate(cx2, cy2);
    ctx.rotate(t * 0.8);
    ctx.strokeStyle = 'rgba(255,215,0,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let oi = 0; oi < 8; oi++) {
      const oa = (oi / 8) * Math.PI * 2;
      if (oi === 0) ctx.moveTo(Math.cos(oa)*22, Math.sin(oa)*22);
      else ctx.lineTo(Math.cos(oa)*22, Math.sin(oa)*22);
    }
    ctx.closePath(); ctx.stroke();
    // Golden vertices
    ctx.fillStyle = COL.gold;
    for (let oi = 0; oi < 8; oi++) {
      const oa = (oi / 8) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(Math.cos(oa)*22, Math.sin(oa)*22, 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // Layer 2: Star of David (t*1.5)
    ctx.save();
    ctx.translate(cx2, cy2);
    ctx.rotate(t * 1.5);
    ctx.strokeStyle = 'rgba(200,160,255,0.5)'; ctx.lineWidth = 1.2;
    for (let tri = 0; tri < 2; tri++) {
      ctx.save(); ctx.rotate(tri * Math.PI/3);
      ctx.beginPath();
      for (let si = 0; si < 3; si++) {
        const sa = (si / 3) * Math.PI * 2 - Math.PI/2;
        if (si === 0) ctx.moveTo(Math.cos(sa)*18, Math.sin(sa)*18);
        else ctx.lineTo(Math.cos(sa)*18, Math.sin(sa)*18);
      }
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // Layer 3: Inner rune circle (t*-0.6)
    ctx.save();
    ctx.translate(cx2, cy2);
    ctx.rotate(t * -0.6);
    ctx.strokeStyle = 'rgba(0,220,180,0.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.stroke();
    // Calligraphy-inspired bezier shapes
    for (let ri = 0; ri < 4; ri++) {
      ctx.save(); ctx.rotate(ri * Math.PI/2);
      ctx.beginPath(); ctx.moveTo(0, -10); ctx.bezierCurveTo(6, -8, 8, -4, 10, 0); ctx.bezierCurveTo(8, 4, 6, 8, 0, 10); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // Energy tendrils (when sin(t*3) > 0.8)
    if (Math.sin(t * 3) > 0.8) {
      ctx.save();
      ctx.translate(cx2, cy2);
      const tendrilAlpha = (Math.sin(t * 3) - 0.8) / 0.2;
      ctx.globalAlpha = tendrilAlpha * 0.7;
      ctx.strokeStyle = COL.gold; ctx.lineWidth = 1.5;
      ctx.shadowBlur = 8; ctx.shadowColor = COL.gold;
      for (let ti = 0; ti < 5; ti++) {
        const ta = t * 2 + (ti / 5) * Math.PI * 2;
        const tLen = 20 + Math.sin(t * 5 + ti) * 10;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ta)*22, Math.sin(ta)*22);
        ctx.bezierCurveTo(Math.cos(ta+0.3)*(22+tLen*0.5), Math.sin(ta+0.3)*(22+tLen*0.5), Math.cos(ta-0.2)*(22+tLen*0.8), Math.sin(ta-0.2)*(22+tLen*0.8), Math.cos(ta)*( 22+tLen), Math.sin(ta)*(22+tLen));
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Orbiting 4-point sparkle stars
    for (let os = 0; os < 4; os++) {
      const oa = t * 1.2 + (os / 4) * Math.PI * 2;
      const or2 = 36;
      const ox = cx2 + Math.cos(oa) * or2;
      const oy = cy2 + Math.sin(oa) * or2;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.rotate(t * 2);
      ctx.fillStyle = COL.gold;
      ctx.shadowBlur = 6; ctx.shadowColor = COL.gold;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.moveTo(0, -5); ctx.lineTo(1.2, -1.2); ctx.lineTo(5, 0);
      ctx.lineTo(1.2, 1.2); ctx.lineTo(0, 5); ctx.lineTo(-1.2, 1.2);
      ctx.lineTo(-5, 0); ctx.lineTo(-1.2, -1.2); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    ctx.fillStyle = COL.gold; ctx.font = 'bold 10px Georgia'; ctx.textAlign = 'center';
    ctx.shadowBlur = 8; ctx.shadowColor = COL.gold;
    ctx.fillText('PORTAL', cx2, p.y - 10);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  drawLighting(camX, t) {
    // Dark overlay multiply
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(0,0,30,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // Torch light (additive screen blend)
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const torch of this.torches) {
      const sx = torch.x - camX;
      if (sx < -120 || sx > W + 120) continue;
      const flicker = 0.75 + 0.25 * Math.sin(t * 14 + torch.x * 0.02);
      const tGlow = ctx.createRadialGradient(sx, torch.y, 2, sx, torch.y, 120);
      tGlow.addColorStop(0, `rgba(255,140,0,${0.15 * flicker})`);
      tGlow.addColorStop(0.5, `rgba(200,80,0,${0.06 * flicker})`);
      tGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = tGlow;
      ctx.beginPath(); ctx.arc(sx, torch.y, 120, 0, Math.PI*2); ctx.fill();
    }
    // Portal golden light
    if (this.portal) {
      const psx = this.portal.x - camX + this.portal.w/2;
      const psy = this.portal.y + this.portal.h/2;
      if (psx > -200 && psx < W + 200) {
        const portalLight = ctx.createRadialGradient(psx, psy, 5, psx, psy, 200);
        portalLight.addColorStop(0, 'rgba(255,200,50,0.12)');
        portalLight.addColorStop(1, 'transparent');
        ctx.fillStyle = portalLight;
        ctx.beginPath(); ctx.arc(psx, psy, 200, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }

  drawEnemies(camX) {
    for (const e of this.enemies) e.draw(camX);
  }
}

// =====================================================================
// CAMERA
// =====================================================================
class Camera {
  constructor() { this.x = 0; this.targetX = 0; }
  update(player, levelWidth) {
    this.targetX = player.x - W * 0.35;
    this.targetX = Math.max(0, Math.min(this.targetX, levelWidth - W));
    this.x += (this.targetX - this.x) * 0.1;
  }
}

// =====================================================================
// UTILITY
// =====================================================================
function aabbOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// =====================================================================
// HUD
// =====================================================================
function drawHUD(player, t, hintsAlpha) {
  // Ornate Persian-style frame around health area
  ctx.save();
  ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 1.5;
  // Pointed arch top frame on left side
  ctx.beginPath();
  ctx.moveTo(8, 52); ctx.lineTo(8, 12);
  ctx.arc(8 + player.maxHealth * 17 + 2, 12, player.maxHealth * 17 + 2, Math.PI, 0);
  ctx.lineTo(8 + (player.maxHealth * 17 + 2) * 2, 52);
  ctx.stroke();
  ctx.strokeStyle = '#4a2060'; ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(10, 50); ctx.lineTo(10, 14);
  ctx.arc(8 + player.maxHealth * 17 + 2, 14, player.maxHealth * 17, Math.PI, 0);
  ctx.lineTo(8 + (player.maxHealth * 17 + 2) * 2 - 2, 50);
  ctx.stroke();
  ctx.restore();

  // Hearts
  for (let i = 0; i < player.maxHealth; i++) {
    const hx = 22 + i * 34;
    const hy = 26;
    const isLow = player.health <= 2;
    const pulse = isLow ? (1.0 + 0.05 * Math.sin(t * 4)) : 1.0;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.scale(pulse, pulse);
    ctx.translate(-hx, -hy);
    ctx.shadowBlur = i < player.health ? 10 : 0;
    ctx.shadowColor = COL.heartRed;
    const filled = i < player.health;
    drawHeart(hx, hy, 14, filled ? COL.heartRed : '#333333');
    // Inner highlight on filled hearts
    if (filled) {
      ctx.fillStyle = 'rgba(255,150,150,0.35)';
      ctx.beginPath(); ctx.arc(hx - 4, hy - 2, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // Full-width ornamental divider at top
  ctx.save();
  ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(W, 5); ctx.stroke();
  // Small decorative element at center of divider
  ctx.fillStyle = COL.gold;
  ctx.save(); ctx.translate(W/2, 5); ctx.rotate(Math.PI/4);
  ctx.fillRect(-3, -3, 6, 6);
  ctx.restore();
  ctx.beginPath(); ctx.arc(W/2 - 16, 5, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W/2 + 16, 5, 2, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // Title: draw each letter separately for letter-spacing simulation
  const title = 'PRINCE OF PERSIA';
  ctx.save();
  ctx.shadowBlur = 15; ctx.shadowColor = COL.gold;
  ctx.fillStyle = COL.gold;
  ctx.font = 'bold 16px Georgia';
  ctx.textAlign = 'left';
  let letterX = W - 16 - 172; // approx start
  for (let li = 0; li < title.length; li++) {
    ctx.fillText(title[li], letterX, 30);
    letterX += ctx.measureText(title[li]).width + 1.2;
  }
  // Text shadow offset
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#000020';
  letterX = W - 14 - 172;
  for (let li = 0; li < title.length; li++) {
    ctx.fillText(title[li], letterX + 2, 32);
    letterX += ctx.measureText(title[li]).width + 1.2;
  }
  ctx.globalAlpha = 1;
  // Decorative lines from both sides of title
  ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(W - 190, 25); ctx.lineTo(W - 185, 25); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W - 10, 25); ctx.lineTo(W - 15, 25); ctx.stroke();

  ctx.fillStyle = COL.purpleLight;
  ctx.font = '11px Georgia';
  ctx.textAlign = 'right';
  ctx.shadowBlur = 8; ctx.shadowColor = COL.purpleLight;
  ctx.fillText('THE LOST CROWN', W - 16, 46);
  ctx.shadowBlur = 0;
  ctx.restore();

  // Crystal timer
  if (player.crystalTimer > 0) {
    ctx.save();
    ctx.shadowBlur = 12; ctx.shadowColor = COL.teal;
    ctx.fillStyle = COL.teal;
    ctx.font = 'bold 13px Georgia';
    ctx.textAlign = 'center';
    ctx.fillText(`INVINCIBLE! ${player.crystalTimer.toFixed(1)}s`, W/2, 28);
    ctx.shadowBlur = 0; ctx.restore();
  }

  // Controls hint
  if (hintsAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = hintsAlpha;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W/2 - 200, H - 50, 400, 38);
    ctx.fillStyle = '#ccbbdd';
    ctx.font = '12px Georgia'; ctx.textAlign = 'center';
    ctx.fillText('ARROWS/WASD: Move  |  W/SPACE/UP: Jump  |  X/J: Attack  |  Double-tap: Dash', W/2, H - 28);
    ctx.restore();
  }
}

function drawHeart(x, y, size, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + size * 0.3);
  ctx.bezierCurveTo(x, y - size * 0.1, x - size, y - size * 0.1, x - size, y + size * 0.3);
  ctx.bezierCurveTo(x - size, y + size * 0.7, x, y + size * 1.1, x, y + size * 1.2);
  ctx.bezierCurveTo(x, y + size * 1.1, x + size, y + size * 0.7, x + size, y + size * 0.3);
  ctx.bezierCurveTo(x + size, y - size * 0.1, x, y - size * 0.1, x, y + size * 0.3);
  ctx.fill();
}

function drawDeathScreen() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#880000'; ctx.lineWidth = 3;
  ctx.strokeRect(60, 160, W-120, 220);
  ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 1;
  ctx.strokeRect(66, 166, W-132, 208);

  ctx.fillStyle = '#cc1111';
  ctx.font = 'bold 72px Georgia'; ctx.textAlign = 'center';
  ctx.shadowBlur = 30; ctx.shadowColor = '#ff0000';
  ctx.fillText('YOU DIED', W/2, 280);
  ctx.shadowBlur = 0;
  ctx.fillStyle = COL.gold;
  ctx.font = '20px Georgia';
  ctx.fillText('Press R or SPACE to continue...', W/2, 330);
  ctx.restore();
}

function drawWinScreen(t) {
  ctx.save();
  const winGrad = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, W);
  winGrad.addColorStop(0, 'rgba(255,220,100,0.85)');
  winGrad.addColorStop(0.5, 'rgba(100,0,200,0.6)');
  winGrad.addColorStop(1, 'rgba(0,0,20,0.7)');
  ctx.fillStyle = winGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = COL.gold;
  ctx.font = 'bold 80px Georgia'; ctx.textAlign = 'center';
  ctx.shadowBlur = 40; ctx.shadowColor = '#ffee00';
  ctx.fillText('VICTORY!', W/2, 270);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '22px Georgia';
  ctx.fillText('The Prince reclaims the Lost Crown!', W/2, 320);
  ctx.fillStyle = COL.teal;
  ctx.font = '18px Georgia';
  ctx.fillText('Press R to play again', W/2, 360);
  ctx.restore();
}

// =====================================================================
// INPUT
// =====================================================================
const keys = {};
const justPressed = {};
window.addEventListener('keydown', e => {
  if (!keys[e.key]) justPressed[e.key] = true;
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// =====================================================================
// GAME CLASS
// =====================================================================
class Game {
  constructor() {
    this.state = 'playing';
    this.time = 0;
    this.hintsTimer = 6.0;
    this.audio = new AudioEngine();
    this.particles = new ParticleSystem();
    this.level = new Level();
    this.camera = new Camera();
    this.player = new Player(100, 460);
    this.restartCooldown = 0;
    this.lastTime = null;
    this.winParticleTimer = 0;
    this.screenShake = 0;
    this._prevPlayerHealth = 6;
  }

  reset() {
    this.state = 'playing';
    this.time = 0;
    this.particles = new ParticleSystem();
    this.level = new Level();
    this.camera = new Camera();
    this.player = new Player(100, 460);
    this.hintsTimer = 6.0;
    this.restartCooldown = 0.5;
    this.screenShake = 0;
    this._prevPlayerHealth = 6;
  }

  update(dt) {
    if (dt > 0.1) dt = 0.1;
    this.time += dt;
    this.restartCooldown = Math.max(0, this.restartCooldown - dt);
    this.screenShake = Math.max(0, this.screenShake - dt * 26);

    if (Math.random() < 0.4) {
      const torches = this.level.torches;
      const torch = torches[Math.floor(Math.random() * torches.length)];
      if (torch) this.particles.torch(torch.x, torch.y);
    }

    if (this.level.portal) {
      if (Math.random() < 0.5) this.particles.portalSwirl(this.level.portal.x + this.level.portal.w/2, this.level.portal.y + this.level.portal.h/2);
    }

    if (this.state === 'playing') {
      this.hintsTimer -= dt;

      const p = this.player;

      // Screen shake on damage
      if (p.health < this._prevPlayerHealth) {
        this.screenShake = 8;
      }
      this._prevPlayerHealth = p.health;

      if ((justPressed['ArrowUp'] || justPressed['w'] || justPressed['W'] || justPressed[' ']) && !p.dead) {
        p.tryJump(this.audio, this.particles);
      }

      if ((justPressed['x'] || justPressed['X'] || justPressed['j'] || justPressed['J']) && !p.dead) {
        p.attack(this.audio, this.particles);
      }

      if (justPressed['ArrowRight'] || justPressed['d'] || justPressed['D']) p.tryDash(1, this.audio);
      if (justPressed['ArrowLeft'] || justPressed['a'] || justPressed['A']) p.tryDash(-1, this.audio);

      p.update(dt, keys, this.level, this.audio, this.particles, this.camera);
      this.level.update(dt, p, this.audio, this.particles);
      this.camera.update(p, this.level.width);
      this.particles.update(dt);

      if (p.dead) { this.state = 'dead'; this.audio.stopMusic(); }
      if (p.won) { this.state = 'won'; this.audio.stopMusic(); }

      if (Math.random() < 0.15) this.particles.aura(p.x + Math.random() * p.w, p.y + Math.random() * p.h);

    } else if (this.state === 'dead' || this.state === 'won') {
      this.particles.update(dt);
      if (this.state === 'won') {
        this.winParticleTimer += dt;
        if (this.winParticleTimer > 0.08) {
          this.winParticleTimer = 0;
          const px = Math.random() * W + this.camera.x;
          this.particles.deathBurst(px, Math.random() * H, [COL.gold, '#fff', COL.teal, COL.purple]);
        }
      }
      if (this.restartCooldown <= 0 && (justPressed['r'] || justPressed['R'] || justPressed[' '])) {
        this.reset();
        this.audio.startMusic();
      }
    }

    for (const k in justPressed) delete justPressed[k];
  }

  draw() {
    const camX = this.camera.x;
    const t = this.time;

    // Screen shake
    ctx.save();
    if (this.screenShake > 0) {
      const shakeX = (Math.random() - 0.5) * this.screenShake * 2;
      const shakeY = (Math.random() - 0.5) * this.screenShake * 2;
      ctx.translate(shakeX, shakeY);
    }

    // Background
    this.level.drawBackground(camX, t);

    // Ground tiles
    this.level.drawTiles(camX);

    // Torches
    this.level.drawTorches(camX, t);

    // Lighting system (after tiles, before enemies)
    this.level.drawLighting(camX, t);

    // Pendulums
    this.level.drawPendulums(camX);

    // Crystals
    this.level.drawCrystals(camX, t);

    // Portal
    this.level.drawPortal(camX, t);

    // Enemies
    this.level.drawEnemies(camX);

    // Player
    if (!this.player.dead || this.player.y < 700) this.player.draw(camX);

    // Particles
    this.particles.draw(camX);

    // Post-FX: Vignette
    const vigGrad = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, W*0.75);
    vigGrad.addColorStop(0, 'transparent');
    vigGrad.addColorStop(1, 'rgba(0,0,10,0.7)');
    ctx.fillStyle = vigGrad;
    ctx.fillRect(0, 0, W, H);

    // Post-FX: Hurt flash
    if (this.player.hurtTimer > 0) {
      ctx.fillStyle = `rgba(180,0,0,${0.25 * this.player.hurtTimer / 0.3})`;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore(); // end screen shake transform

    // HUD (outside shake)
    const hintsAlpha = Math.max(0, Math.min(1, this.hintsTimer));
    drawHUD(this.player, t, hintsAlpha);

    // Overlays
    if (this.state === 'dead') drawDeathScreen();
    if (this.state === 'won') drawWinScreen(t);
  }

  start() {
    const loop = (timestamp) => {
      if (!this.lastTime) this.lastTime = timestamp;
      const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
      this.lastTime = timestamp;
      this.update(dt);
      this.draw();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

// =====================================================================
// START SCREEN
// =====================================================================
function drawStartScreen(t) {
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#03000f'); skyGrad.addColorStop(0.5, '#0a0025'); skyGrad.addColorStop(1, '#1a0050');
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, H);

  // Aurora bands
  for (let ab = 0; ab < 3; ab++) {
    const auroraX = W * 0.5 + Math.sin(t * 0.25 + ab * 0.9) * W * 0.3;
    const auroraY = 100 + ab * 60;
    ctx.save();
    ctx.globalAlpha = 0.05 + 0.02 * Math.sin(t * 0.4 + ab);
    const aGrad = ctx.createRadialGradient(auroraX, auroraY, 0, auroraX, auroraY, 280);
    const colors = ['#6600ff','#00ccaa','#aa00cc'];
    aGrad.addColorStop(0, colors[ab]); aGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = aGrad;
    ctx.beginPath(); ctx.ellipse(auroraX, auroraY, 280, 50, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Stars
  for (let i = 0; i < 80; i++) {
    const sx = (i * 137.508) % W, sy = (i * 97.3) % (H * 0.7);
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.2 + i * 0.7));
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx, sy, 0.8 + (i%3)*0.4, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Moon
  const mg = ctx.createRadialGradient(700, 60, 4, 700, 60, 35);
  mg.addColorStop(0, '#fffce8'); mg.addColorStop(0.7, '#f0d060'); mg.addColorStop(1, 'transparent');
  ctx.shadowBlur = 30; ctx.shadowColor = '#ffdd6666'; ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(700, 60, 32, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Palace silhouette (more detailed)
  ctx.fillStyle = '#180030';
  ctx.fillRect(0, 360, W, 240);
  const blds = [[60,240,220],[320,200,160],[520,260,240],[800,220,180],[940,180,120]];
  for (const [bx,bh,bw] of blds) {
    ctx.fillStyle = '#140028';
    ctx.fillRect(bx, 600-bh, bw, bh);
    ctx.beginPath(); ctx.arc(bx+bw/2, 600-bh, bw/2.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(bx+bw-15, 600-bh-70, 10, 70);
    ctx.beginPath(); ctx.moveTo(bx+bw-10, 600-bh-70); ctx.lineTo(bx+bw-5, 600-bh-100); ctx.lineTo(bx+bw, 600-bh-70); ctx.fill();
    // Second minaret
    ctx.fillRect(bx+5, 600-bh-50, 8, 50);
    ctx.beginPath(); ctx.moveTo(bx+5, 600-bh-50); ctx.lineTo(bx+9, 600-bh-75); ctx.lineTo(bx+13, 600-bh-50); ctx.fill();
    // Ornament dots
    for (let od = bx+15; od < bx+bw-10; od += 20) {
      const p2 = 0.25 + 0.2*Math.sin(t*2+od*0.04);
      ctx.save(); ctx.globalAlpha = p2;
      ctx.fillStyle = '#ffaa44'; ctx.shadowBlur=3; ctx.shadowColor='#ffaa44';
      ctx.beginPath(); ctx.arc(od, 600-bh-2, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur=0; ctx.restore();
    }
  }

  // Animated Persian mandala in center background
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.translate(W/2, H/2 - 20);
  // Concentric rotating polygons
  const polyDefs = [
    { sides: 6, r: 40, speed: 0.3, color: COL.goldDark },
    { sides: 12, r: 70, speed: -0.18, color: COL.goldDark },
    { sides: 6, r: 100, speed: 0.22, color: COL.goldDark },
    { sides: 8, r: 130, speed: -0.14, color: '#8B6914' },
    { sides: 12, r: 160, speed: 0.1, color: '#8B6914' },
  ];
  for (const pd of polyDefs) {
    ctx.save();
    ctx.rotate(t * pd.speed);
    ctx.strokeStyle = pd.color; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let pi2 = 0; pi2 < pd.sides; pi2++) {
      const pa = (pi2 / pd.sides) * Math.PI * 2 - Math.PI/2;
      if (pi2 === 0) ctx.moveTo(Math.cos(pa)*pd.r, Math.sin(pa)*pd.r);
      else ctx.lineTo(Math.cos(pa)*pd.r, Math.sin(pa)*pd.r);
    }
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  }
  // Star burst lines
  ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 0.8;
  for (let sl = 0; sl < 12; sl++) {
    ctx.save();
    ctx.rotate(t * 0.08 + (sl / 12) * Math.PI * 2);
    ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(155, 0); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // Dark overlay for readability
  ctx.fillStyle = 'rgba(0,0,10,0.55)'; ctx.fillRect(0, 0, W, H);

  // Ornate frame
  ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 2;
  ctx.strokeRect(40, 90, W-80, 430);
  ctx.strokeStyle = COL.purpleDark; ctx.lineWidth = 1;
  ctx.strokeRect(46, 96, W-92, 418);
  // Corner ornaments
  for (const [cx2, cy2] of [[46,96],[W-46,96],[46,514],[W-46,514]]) {
    ctx.fillStyle = COL.gold;
    ctx.beginPath(); ctx.arc(cx2, cy2, 5, 0, Math.PI*2); ctx.fill();
  }

  ctx.textAlign = 'center';

  // Persian ornament above title (mirrored curved line ornaments)
  ctx.save();
  ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.8;
  // Left ornament
  ctx.beginPath(); ctx.moveTo(W/2 - 140, 162); ctx.bezierCurveTo(W/2 - 100, 155, W/2 - 60, 160, W/2 - 20, 158); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2 - 148, 162, 5, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2 - 120, 156, 3, 0, Math.PI*2); ctx.stroke();
  // Right ornament (mirrored)
  ctx.beginPath(); ctx.moveTo(W/2 + 140, 162); ctx.bezierCurveTo(W/2 + 100, 155, W/2 + 60, 160, W/2 + 20, 158); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2 + 148, 162, 5, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2 + 120, 156, 3, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  // Main title
  ctx.save();
  ctx.shadowBlur = 50; ctx.shadowColor = COL.gold;
  ctx.fillStyle = COL.gold;
  ctx.font = 'bold 58px Georgia';
  ctx.fillText('PRINCE OF PERSIA', W/2, 195);
  // Shadow offset
  ctx.shadowBlur = 0; ctx.globalAlpha = 0.3; ctx.fillStyle = '#000020';
  ctx.fillText('PRINCE OF PERSIA', W/2 + 3, 198);
  ctx.restore();

  ctx.save();
  ctx.shadowBlur = 25; ctx.shadowColor = COL.purpleLight;
  ctx.fillStyle = COL.purpleLight;
  ctx.font = 'bold 30px Georgia';
  ctx.fillText('THE LOST CROWN', W/2, 244);
  ctx.restore();

  // Persian ornament below subtitle (mirrored)
  ctx.save();
  ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.8;
  ctx.beginPath(); ctx.moveTo(W/2 - 120, 258); ctx.bezierCurveTo(W/2 - 80, 265, W/2 - 40, 260, W/2 - 10, 262); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2 - 128, 258, 5, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2 + 120, 258); ctx.bezierCurveTo(W/2 + 80, 265, W/2 + 40, 260, W/2 + 10, 262); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2 + 128, 258, 5, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#aa9988'; ctx.font = 'italic 15px Georgia';
  ctx.fillText('A fan tribute — HTML5 Canvas Edition', W/2, 282);

  // Divider
  ctx.strokeStyle = COL.gold; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(180, 300); ctx.lineTo(W-180, 300); ctx.stroke();
  ctx.fillStyle = COL.gold;
  ctx.save(); ctx.translate(W/2, 300); ctx.rotate(Math.PI/4);
  ctx.fillRect(-5,-5,10,10); ctx.restore();

  // Controls list
  const lines = [
    [COL.teal, 'bold 14px', 'CONTROLS'],
    ['#ddccbb', '14px', 'ARROWS / WASD  —  Move'],
    ['#ddccbb', '14px', 'W / SPACE / UP  —  Jump  (double jump supported!)'],
    ['#ddccbb', '14px', 'X / J  —  Sword Attack'],
    ['#ddccbb', '14px', 'Double-tap direction  —  Dash'],
    ['', '', ''],
    [COL.gold, 'bold 14px', 'OBJECTIVE'],
    ['#ddccbb', '14px', 'Reach the golden portal at the end of the level'],
    ['#cceeaa', '13px', 'Collect Time Crystals for brief invincibility'],
    ['#ccaacc', '13px', 'Defeat 3 Persian Guards blocking your path'],
  ];
  let ly = 330;
  for (const [color, font, text] of lines) {
    if (!text) { ly += 8; continue; }
    ctx.fillStyle = color; ctx.font = `${font} Georgia`;
    ctx.fillText(text, W/2, ly);
    ly += 24;
  }

  // Pulse prompt
  const pulse = 0.6 + 0.4 * Math.sin(t * 3);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.shadowBlur = 15; ctx.shadowColor = COL.teal;
  ctx.fillStyle = COL.teal;
  ctx.font = 'bold 20px Georgia';
  ctx.fillText('Press any key or click to begin', W/2, 500);
  ctx.restore();
}

// =====================================================================
// MAIN
// =====================================================================
let gameStarted = false;
let startTime = performance.now();
const game = new Game();

function preStartLoop(timestamp) {
  const t = (timestamp - startTime) / 1000;
  drawStartScreen(t);
  if (!gameStarted) requestAnimationFrame(preStartLoop);
}
requestAnimationFrame(preStartLoop);

function beginGame() {
  if (gameStarted) return;
  gameStarted = true;
  for (const k in justPressed) delete justPressed[k];
  for (const k in keys) delete keys[k];
  game.audio.resume();
  game.audio.startMusic();
  game.start();
  document.removeEventListener('keydown', beginGame);
  canvas.removeEventListener('click', beginGame);
}
document.addEventListener('keydown', beginGame);
canvas.addEventListener('click', beginGame);
</script>
