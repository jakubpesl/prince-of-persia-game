<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prince of Persia: The Lost Crown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0010; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Georgia', serif; }
  #gameCanvas { display: block; border: 2px solid #4a2060; box-shadow: 0 0 40px #6a00ff88; }
  #ui { position: absolute; top: 0; left: 50%; transform: translateX(-50%); pointer-events: none; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="960" height="600"></canvas>
<script>
// =====================================================================
// PRINCE OF PERSIA: THE LOST CROWN - Single File HTML5 Game
// =====================================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Polyfill for ctx.roundRect (Safari < 15.4)
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    const rad = typeof r === 'number' ? r : (Array.isArray(r) ? (r[0] || 0) : 0);
    const safe = Math.min(rad, Math.min(Math.abs(w), Math.abs(h)) / 2);
    if (safe <= 0) { this.rect(x, y, w, h); return this; }
    this.moveTo(x + safe, y);
    this.lineTo(x + w - safe, y);
    this.quadraticCurveTo(x + w, y, x + w, y + safe);
    this.lineTo(x + w, y + h - safe);
    this.quadraticCurveTo(x + w, y + h, x + w - safe, y + h);
    this.lineTo(x + safe, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - safe);
    this.lineTo(x, y + safe);
    this.quadraticCurveTo(x, y, x + safe, y);
    this.closePath();
    return this;
  };
}

// =====================================================================
// CONSTANTS
// =====================================================================
const TILE = 48;
const GRAVITY = 1800;
const PLAYER_SPEED = 220;
const JUMP_FORCE = -620;
const DASH_FORCE = 480;
const DASH_DURATION = 0.18;

const COL = {
  sky1: '#0a0018', sky2: '#1a0040', sky3: '#2d0060',
  gold: '#ffd700', goldDark: '#b8860b', goldGlow: '#ffaa00',
  purple: '#6a00ff', purpleDark: '#3d0080', purpleLight: '#aa44ff',
  teal: '#00d4aa', tealDark: '#007a60',
  stone: '#3a2a4a', stoneDark: '#1a1028', stoneLight: '#5a4a6a',
  torch: '#ff8800', torchGlow: '#ff440088',
  blood: '#8b0000', spark: '#ffcc00',
  white: '#ffffff', red: '#cc2200', heartRed: '#ff3344',
  guardRed: '#8b1a1a', guardDark: '#5a0000',
};

// Pre-generate star field data (seeded)
const STARS = (() => {
  const s = [];
  for (let i = 0; i < 200; i++) {
    const rng = (seed) => ((Math.sin(seed * 127.1 + 311.7) * 43758.5453) % 1 + 1) % 1;
    s.push({
      x: rng(i * 3) * W,
      y: rng(i * 3 + 1) * (H * 0.62),
      size: i < 100 ? 0.3 : i < 170 ? 0.8 : 1.5,
      twinkleOffset: rng(i * 3 + 2) * Math.PI * 2,
      cluster: i > 155 && i < 185, // dense cluster upper-right
    });
  }
  return s;
})();

// Shooting star state
let _shootingStar = { active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0 };

// =====================================================================
// AUDIO ENGINE
// =====================================================================
class AudioEngine {
  constructor() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.35;
      this.masterGain.connect(this.ctx.destination);
      this.musicPlaying = false;
      this.musicNodes = [];
    } catch(e) { this.ctx = null; }
  }

  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }

  _play(freq, type, duration, gainVal = 0.3, detune = 0, delay = 0) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.masterGain);
    osc.type = type; osc.frequency.value = freq; osc.detune.value = detune;
    const t = this.ctx.currentTime + delay;
    gain.gain.setValueAtTime(gainVal, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.start(t); osc.stop(t + duration);
  }

  _noise(duration, gainVal = 0.2, freq = 100, q = 1, delay = 0) {
    if (!this.ctx) return;
    const bufSize = this.ctx.sampleRate * duration;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = freq; filter.Q.value = q;
    const gain = this.ctx.createGain();
    src.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
    const t = this.ctx.currentTime + delay;
    gain.gain.setValueAtTime(gainVal, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    src.start(t); src.stop(t + duration + 0.01);
  }

  jump() {
    this._play(220, 'sine', 0.15, 0.2);
    this._play(440, 'sine', 0.12, 0.15, 0, 0.05);
    this._play(660, 'sine', 0.08, 0.1, 0, 0.1);
  }

  land() { this._noise(0.12, 0.4, 80, 2); }

  swordSwing() {
    this._noise(0.18, 0.25, 2000, 8);
    this._play(800, 'sawtooth', 0.18, 0.1, 0);
  }

  swordHit() {
    this._play(300, 'square', 0.1, 0.3);
    this._noise(0.08, 0.35, 1500, 5);
    this._play(150, 'sawtooth', 0.12, 0.25, 0, 0.02);
  }

  enemyDeath() {
    this._play(400, 'sawtooth', 0.3, 0.25);
    this._play(300, 'sawtooth', 0.25, 0.2, 0, 0.1);
    this._play(200, 'sawtooth', 0.2, 0.15, 0, 0.2);
    this._play(100, 'sawtooth', 0.15, 0.1, 0, 0.3);
    this._noise(0.4, 0.2, 120, 3, 0.1);
  }

  playerHurt() {
    this._play(180, 'sawtooth', 0.2, 0.3);
    this._noise(0.15, 0.3, 200, 3);
  }

  spikeDeath() {
    this._play(100, 'sawtooth', 0.5, 0.4);
    this._noise(0.5, 0.5, 80, 2);
    this._play(60, 'sine', 0.6, 0.35, 0, 0.1);
  }

  portal() {
    for (let i = 0; i < 8; i++) {
      this._play(440 + i * 110, 'sine', 0.6, 0.12, 0, i * 0.08);
    }
  }

  footstep() { this._noise(0.06, 0.12, 300, 4); }

  startMusic() {
    if (!this.ctx || this.musicPlaying) return;
    this.musicPlaying = true;
    const scale = [293.66, 329.63, 349.23, 415.30, 440, 466.16, 554.37, 587.33];
    const melody = [0,2,4,3,5,4,2,0,1,3,2,4,6,5,4,3,0,2,4,5,3,2,1,0];
    const bpm = 68;
    const beat = 60 / bpm;
    let time = this.ctx.currentTime + 0.5;

    const playMelody = () => {
      if (!this.musicPlaying) return;
      melody.forEach((note, i) => {
        const freq = scale[note % scale.length];
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 1200;
        osc.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
        osc.type = 'triangle'; osc.frequency.value = freq;
        const t = time + i * beat * 0.5;
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.08, t + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, t + beat * 0.45);
        osc.start(t); osc.stop(t + beat * 0.5);
      });
      const bass = this.ctx.createOscillator();
      const bassGain = this.ctx.createGain();
      bass.connect(bassGain); bassGain.connect(this.masterGain);
      bass.type = 'sine'; bass.frequency.value = 73.42;
      bassGain.gain.setValueAtTime(0.06, time);
      bassGain.gain.setValueAtTime(0.06, time + melody.length * beat * 0.5);
      bassGain.gain.exponentialRampToValueAtTime(0.001, time + melody.length * beat * 0.5 + 0.5);
      bass.start(time); bass.stop(time + melody.length * beat * 0.5 + 0.5);
      time += melody.length * beat * 0.5 + 0.2;
      this._musicTimer = setTimeout(playMelody, (melody.length * beat * 0.5 + 0.2) * 1000);
    };
    playMelody();
  }

  stopMusic() {
    this.musicPlaying = false;
    if (this._musicTimer) clearTimeout(this._musicTimer);
  }
}

// =====================================================================
// PARTICLE SYSTEM
// =====================================================================
class ParticleSystem {
  constructor() { this.particles = []; }

  emit(x, y, opts = {}) {
    const count = opts.count || 8;
    for (let i = 0; i < count; i++) {
      const angle = opts.angle !== undefined ? opts.angle + (Math.random()-0.5)*opts.spread : Math.random() * Math.PI * 2;
      const speed = opts.speed || (60 + Math.random() * 120);
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed * (0.5 + Math.random()),
        vy: Math.sin(angle) * speed * (0.5 + Math.random()),
        life: 1, maxLife: opts.life || (0.5 + Math.random() * 0.5),
        color: Array.isArray(opts.color) ? opts.color[Math.floor(Math.random() * opts.color.length)] : (opts.color || '#fff'),
        size: opts.size || (2 + Math.random() * 3),
        gravity: opts.gravity !== undefined ? opts.gravity : 400,
        glow: opts.glow || false,
      });
    }
  }

  sparks(x, y) {
    this.emit(x, y, { count: 12, color: [COL.spark, '#fff', COL.gold], speed: 200, life: 0.4, size: 2, gravity: 600, glow: true });
  }

  blood(x, y) {
    this.emit(x, y, { count: 16, color: [COL.blood, '#660000', '#aa1111'], speed: 150, life: 0.7, size: 3, angle: -Math.PI/2, spread: Math.PI, gravity: 500 });
  }

  aura(x, y) {
    this.emit(x, y, { count: 3, color: [COL.purple, COL.purpleLight, COL.teal], speed: 30, life: 0.8, size: 2, gravity: -50, glow: true });
  }

  torch(x, y) {
    this.emit(x, y, { count: 2, color: [COL.torch, '#ffcc00', '#ff6600'], speed: 40, life: 0.5, size: 2, angle: -Math.PI/2, spread: 0.8, gravity: -80 });
  }

  deathBurst(x, y, color) {
    this.emit(x, y, { count: 30, color: color || [COL.purple, COL.gold, '#fff'], speed: 280, life: 1.0, size: 4, glow: true, gravity: 300 });
  }

  portalSwirl(x, y) {
    const angle = Math.random() * Math.PI * 2;
    const r = 20 + Math.random() * 15;
    this.emit(x + Math.cos(angle)*r, y + Math.sin(angle)*r, {
      count: 1, color: [COL.gold, '#fff', COL.teal], speed: 60, life: 0.8, size: 2, gravity: -20, glow: true
    });
  }

  dust(x, y) {
    this.emit(x, y, { count: 6, color: ['#8a7a6a', '#6a5a4a', '#aaa'], speed: 80, life: 0.5, size: 2, angle: Math.PI, spread: 0.6, gravity: -30 });
  }

  invincibility(x, y) {
    this.emit(x, y, { count: 2, color: [COL.teal, '#aaffee', '#ffffff'], speed: 50, life: 0.6, size: 2, glow: true, gravity: -60 });
  }

  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.gravity * dt;
      p.vx *= 0.98;
      p.life -= dt / p.maxLife;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  }

  draw(camX) {
    for (const p of this.particles) {
      const alpha = Math.max(0, p.life);
      ctx.save();
      if (p.glow) { ctx.shadowBlur = 8; ctx.shadowColor = p.color; }
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x - camX, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

// =====================================================================
// PLAYER CLASS
// =====================================================================
class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.w = 28; this.h = 52;
    this.vx = 0; this.vy = 0;
    this.onGround = false;
    this.onWall = false; this.wallDir = 0;
    this.facingRight = true;
    this.jumpsLeft = 2;
    this.health = 6; this.maxHealth = 6;
    this.invincible = 0;
    this.invincibleTimer = 0;
    this.dead = false;
    this.won = false;

    this.state = 'idle';
    this.animFrame = 0;
    this.animTimer = 0;
    this.attackTimer = 0;
    this.hurtTimer = 0;

    this.dashing = false;
    this.dashTimer = 0;
    this.dashDir = 1;
    this.lastDirTap = { dir: 0, time: 0 };
    this.dashCooldown = 0;

    this.footstepTimer = 0;
    this.wallJumpTimer = 0;
    this.crystalTimer = 0;

    // Scarf physics segments
    this._scarfSeg = [{x:0,y:0},{x:0,y:0},{x:0,y:0}];
  }

  get hitbox() {
    return { x: this.x + 4, y: this.y, w: this.w - 8, h: this.h };
  }

  get attackHitbox() {
    const reach = 60;
    if (this.facingRight) return { x: this.x + this.w, y: this.y + 10, w: reach, h: 32 };
    return { x: this.x - reach, y: this.y + 10, w: reach, h: 32 };
  }

  tryJump(audio, particles) {
    if (this.wallJumpTimer > 0) {
      this.vy = JUMP_FORCE * 0.9;
      this.vx = -this.wallDir * PLAYER_SPEED * 1.5;
      this.wallJumpTimer = 0;
      this.jumpsLeft = 1;
      audio.jump();
      return;
    }
    if (this.jumpsLeft > 0) {
      this.vy = JUMP_FORCE * (this.jumpsLeft === 2 ? 1 : 0.85);
      this.jumpsLeft--;
      this.onGround = false;
      audio.jump();
      if (this.jumpsLeft === 0) particles.aura(this.x + this.w/2, this.y + this.h/2);
    }
  }

  tryDash(dir, audio) {
    if (this.dashCooldown > 0) return;
    const now = performance.now();
    if (this.lastDirTap.dir === dir && now - this.lastDirTap.time < 300) {
      this.dashing = true;
      this.dashTimer = DASH_DURATION;
      this.dashDir = dir;
      this.dashCooldown = 0.8;
      audio.swordSwing();
    }
    this.lastDirTap = { dir, time: now };
  }

  attack(audio, particles) {
    if (this.attackTimer > 0 || this.dead) return;
    this.attackTimer = 0.4;
    this.state = 'attack';
    audio.swordSwing();
    particles.sparks(
      this.facingRight ? this.x + this.w + 20 : this.x - 20,
      this.y + 20
    );
  }

  takeDamage(audio, particles) {
    if (this.invincible > 0 || this.crystalTimer > 0 || this.dead) return;
    this.health--;
    this.invincible = 1.5;
    this.hurtTimer = 0.3;
    this.state = 'hurt';
    this.vx = this.facingRight ? -200 : 200;
    this.vy = -200;
    audio.playerHurt();
    particles.blood(this.x + this.w/2, this.y + this.h/2);
    if (this.health <= 0) this.die(audio, particles);
  }

  die(audio, particles) {
    this.dead = true;
    this.state = 'death';
    audio.spikeDeath();
    particles.deathBurst(this.x + this.w/2, this.y + this.h/2, [COL.purple, COL.gold, '#fff']);
  }

  update(dt, keys, level, audio, particles, camera) {
    if (this.dead) {
      this.vy += GRAVITY * dt;
      this.y += this.vy * dt;
      return;
    }

    this.invincible = Math.max(0, this.invincible - dt);
    this.crystalTimer = Math.max(0, this.crystalTimer - dt);
    this.attackTimer = Math.max(0, this.attackTimer - dt);
    this.hurtTimer = Math.max(0, this.hurtTimer - dt);
    this.dashCooldown = Math.max(0, this.dashCooldown - dt);
    this.wallJumpTimer = Math.max(0, this.wallJumpTimer - dt);

    if (this.attackTimer > 0) this.state = 'attack';
    else if (this.hurtTimer > 0) this.state = 'hurt';

    if (this.dashing) {
      this.dashTimer -= dt;
      this.vx = this.dashDir * DASH_FORCE * 1.8;
      particles.aura(this.x + this.w/2, this.y + this.h/2);
      if (this.dashTimer <= 0) { this.dashing = false; }
    } else {
      let moveX = 0;
      if (keys['ArrowLeft'] || keys['a']) { moveX = -1; this.facingRight = false; }
      if (keys['ArrowRight'] || keys['d']) { moveX = 1; this.facingRight = true; }

      if (this.attackTimer > 0.1) moveX *= 0.3;

      this.vx = moveX * PLAYER_SPEED;
      this.vy += GRAVITY * dt;
      this.vy = Math.min(this.vy, 900);
    }

    this.x += this.vx * dt;
    level.resolveX(this);
    const wasOnGround = this.onGround;
    this.onGround = false;
    this.onWall = false;
    this.y += this.vy * dt;
    level.resolveY(this, audio, particles);

    if (!wasOnGround && this.onGround) {
      audio.land();
      particles.dust(this.x + this.w/2, this.y + this.h);
    }

    if (this.onGround) this.jumpsLeft = 2;

    if (!this.onGround && this.vy > 0) {
      if (level.checkWallLeft(this)) { this.onWall = true; this.wallDir = -1; this.wallJumpTimer = 0.2; this.vy = Math.min(this.vy, 120); }
      else if (level.checkWallRight(this)) { this.onWall = true; this.wallDir = 1; this.wallJumpTimer = 0.2; this.vy = Math.min(this.vy, 120); }
    }

    if (level.checkPortal(this)) { this.won = true; audio.portal(); }

    if (this.onGround && Math.abs(this.vx) > 50) {
      this.footstepTimer -= dt;
      if (this.footstepTimer <= 0) { audio.footstep(); this.footstepTimer = 0.28; }
    }

    this.animTimer += dt;
    if (!this.dashing && this.attackTimer <= 0 && this.hurtTimer <= 0) {
      if (!this.onGround) this.state = this.vy < 0 ? 'jump' : 'fall';
      else if (Math.abs(this.vx) > 30) this.state = 'run';
      else this.state = 'idle';
    }

    if (this.animTimer > 0.1) { this.animFrame = (this.animFrame + 1) % 4; this.animTimer = 0; }

    if (this.crystalTimer > 0 && Math.random() < 0.3) particles.invincibility(this.x + this.w/2, this.y + this.h/2);

    this.x = Math.max(0, this.x);
  }

  draw(camX) {
    const sx = this.x - camX;
    const sy = this.y;

    ctx.save();
    if (this.invincible > 0 && Math.floor(this.invincible * 10) % 2 === 0 && this.hurtTimer <= 0) {
      ctx.globalAlpha = 0.5;
    }
    if (this.crystalTimer > 0) { ctx.shadowBlur = 20; ctx.shadowColor = COL.teal; }

    ctx.save();
    if (!this.facingRight) {
      ctx.translate(sx + this.w/2, sy);
      ctx.scale(-1, 1);
      ctx.translate(-(sx + this.w/2), -sy);
    }

    this._drawCharacter(sx, sy);
    ctx.restore();
    ctx.restore();
  }

  _drawCharacter(sx, sy) {
    const t = Date.now() * 0.001;
    const breathe = this.state === 'idle' ? Math.sin(t * 2) * 1.5 : 0;
    const runLean = this.state === 'run' ? (this.animFrame % 2 === 0 ? 3 : -1) : 0;

    ctx.save();
    ctx.translate(sx + this.w/2, sy + this.h);

    // === LEGS ===
    const legSwing = (this.state === 'run') ? Math.sin(this.animFrame * Math.PI / 2) * 12 : 0;
    // Back leg
    ctx.save();
    ctx.rotate((legSwing * -0.8) * Math.PI / 180);
    const legGrad = ctx.createLinearGradient(-5, -26, 5, 0);
    legGrad.addColorStop(0, '#1a1030'); legGrad.addColorStop(1, '#0a0818');
    ctx.fillStyle = legGrad;
    ctx.beginPath(); ctx.roundRect(-5, -26, 10, 26, 3); ctx.fill();
    ctx.restore();
    // Front leg
    ctx.save();
    ctx.rotate((legSwing * 0.8) * Math.PI / 180);
    const legGrad2 = ctx.createLinearGradient(-5, -26, 5, 0);
    legGrad2.addColorStop(0, '#221840'); legGrad2.addColorStop(1, '#0f0c28');
    ctx.fillStyle = legGrad2;
    ctx.beginPath(); ctx.roundRect(-4, -26, 10, 26, 3); ctx.fill();
    // Boot
    ctx.fillStyle = '#332240';
    ctx.beginPath(); ctx.ellipse(5, 0, 8, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // === BODY / TUNIC ===
    ctx.translate(0, -breathe);
    ctx.rotate(runLean * Math.PI / 180);
    const tunicGrad = ctx.createLinearGradient(-12, -52, 12, -26);
    tunicGrad.addColorStop(0, '#f0e8d0'); tunicGrad.addColorStop(0.5, '#e8d8b0'); tunicGrad.addColorStop(1, '#d0c090');
    ctx.fillStyle = tunicGrad;
    ctx.beginPath(); ctx.roundRect(-12, -52, 24, 26, [4, 4, 8, 8]); ctx.fill();

    // Tunic fold lines (3 diagonal creases)
    ctx.strokeStyle = 'rgba(160,140,90,0.6)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-8, -50); ctx.lineTo(-4, -38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2, -51); ctx.lineTo(2, -39); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, -49); ctx.lineTo(8, -38); ctx.stroke();

    // Gold embroidery along hem (dotted arc pattern)
    ctx.strokeStyle = COL.gold; ctx.lineWidth = 0.8;
    for (let ex = -10; ex < 10; ex += 4) {
      ctx.beginPath(); ctx.arc(ex, -28, 2, Math.PI, 0); ctx.stroke();
    }

    // Gold trim lines
    ctx.strokeStyle = COL.gold; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-12, -42); ctx.lineTo(12, -42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-12, -32); ctx.lineTo(12, -32); ctx.stroke();

    // Belt
    ctx.fillStyle = COL.goldDark;
    ctx.beginPath(); ctx.roundRect(-13, -30, 26, 6, 2); ctx.fill();
    ctx.fillStyle = COL.gold;
    ctx.beginPath(); ctx.roundRect(-4, -31, 8, 8, 1); ctx.fill();
    // Small pouch on belt
    ctx.fillStyle = '#8B6914';
    ctx.beginPath(); ctx.roundRect(5, -30, 6, 5, 2); ctx.fill();
    ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 0.5;
    ctx.strokeRect(5, -30, 6, 5);

    // === ARMS ===
    const armSwing = (this.state === 'run') ? Math.sin(this.animFrame * Math.PI / 2 + Math.PI) * 15 : 0;
    const attackAngle = this.state === 'attack' ? -60 + this.attackTimer * 150 : 0;
    const armGrad = ctx.createLinearGradient(-4, 0, 4, 18);
    armGrad.addColorStop(0, '#f0c890'); armGrad.addColorStop(1, '#d0a870');

    // Back arm
    ctx.save();
    ctx.translate(-10, -46);
    ctx.rotate((armSwing - 10) * Math.PI/180);
    ctx.fillStyle = armGrad;
    ctx.beginPath(); ctx.roundRect(-4, 0, 8, 18, 3); ctx.fill();
    // Arm bracer back
    ctx.fillStyle = COL.goldDark;
    ctx.beginPath(); ctx.roundRect(-4, 4, 8, 5, 1); ctx.fill();
    ctx.strokeStyle = COL.gold; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(-3,6); ctx.lineTo(3,6); ctx.moveTo(-3,8); ctx.lineTo(3,8); ctx.stroke();
    ctx.restore();

    // Front arm (sword arm)
    ctx.save();
    ctx.translate(10, -46);
    ctx.rotate((attackAngle + armSwing + 10) * Math.PI/180);
    ctx.fillStyle = armGrad;
    ctx.beginPath(); ctx.roundRect(-4, 0, 8, 18, 3); ctx.fill();
    // Arm bracer front with geometric pattern
    ctx.fillStyle = COL.goldDark;
    ctx.beginPath(); ctx.roundRect(-4, 4, 8, 5, 1); ctx.fill();
    ctx.strokeStyle = COL.gold; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(-3,6); ctx.lineTo(3,6); ctx.moveTo(-3,8); ctx.lineTo(3,8); ctx.stroke();
    // Diamond detail on bracer
    ctx.strokeStyle = COL.gold; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(0,5); ctx.lineTo(2,6.5); ctx.lineTo(0,8); ctx.lineTo(-2,6.5); ctx.closePath(); ctx.stroke();

    // Sword
    ctx.save();
    ctx.translate(0, 18);
    ctx.rotate(-30 * Math.PI/180);

    // Sword trail during attack (3-4 fading arcs)
    if (this.state === 'attack') {
      for (let tr = 1; tr <= 3; tr++) {
        ctx.save();
        ctx.rotate(tr * 12 * Math.PI/180);
        ctx.globalAlpha = (0.25 - tr * 0.06) * (this.attackTimer / 0.4);
        ctx.strokeStyle = tr % 2 === 0 ? COL.teal : '#ffffff';
        ctx.lineWidth = 3 - tr * 0.5;
        ctx.beginPath();
        ctx.arc(0, -20, 25, -Math.PI*0.4, Math.PI*0.1);
        ctx.stroke();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    // Blade
    const bladeGrad = ctx.createLinearGradient(-1, -40, 2, 0);
    bladeGrad.addColorStop(0, '#fff'); bladeGrad.addColorStop(0.3, '#cce0ff'); bladeGrad.addColorStop(1, '#8899aa');
    ctx.fillStyle = bladeGrad;
    ctx.beginPath(); ctx.moveTo(-1, -42); ctx.lineTo(3, -42); ctx.lineTo(2, 0); ctx.lineTo(-1, 0); ctx.closePath(); ctx.fill();
    if (this.state === 'attack') { ctx.shadowBlur = 12; ctx.shadowColor = COL.teal; ctx.strokeStyle = COL.teal; ctx.lineWidth = 1; ctx.stroke(); }
    // Guard
    ctx.fillStyle = COL.gold;
    ctx.beginPath(); ctx.roundRect(-7, -4, 14, 4, 1); ctx.fill();
    // Handle
    ctx.fillStyle = '#8B4513';
    ctx.beginPath(); ctx.roundRect(-2, 0, 6, 12, 2); ctx.fill();
    // Leather wrap on handle (zig-zag)
    ctx.strokeStyle = '#5a2a00'; ctx.lineWidth = 0.8;
    for (let hw = 0; hw < 10; hw += 3) {
      ctx.beginPath(); ctx.moveTo(-2, hw+1); ctx.lineTo(4, hw+2.5); ctx.stroke();
    }
    ctx.restore();
    ctx.restore();

    // Shoulder pauldron (front)
    ctx.save();
    ctx.translate(10, -52);
    ctx.fillStyle = '#8b1a1a';
    ctx.beginPath(); ctx.arc(0, 0, 8, Math.PI, 0); ctx.fill();
    // Ridged detail
    ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 0.7;
    for (let ri = 1; ri < 4; ri++) {
      const ra = Math.PI + (ri / 4) * Math.PI;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(ra)*8, Math.sin(ra)*8); ctx.stroke();
    }
    ctx.restore();

    // === HEAD ===
    const headBob = (this.state === 'run') ? Math.abs(Math.sin(this.animFrame * Math.PI / 2)) * -2 : 0;
    ctx.save();
    ctx.translate(0, -52 + headBob);
    // Neck
    ctx.fillStyle = '#d4a870';
    ctx.beginPath(); ctx.roundRect(-4, 0, 8, 8, 2); ctx.fill();
    // Head shape
    const headGrad = ctx.createRadialGradient(-3, -10, 2, 0, -10, 14);
    headGrad.addColorStop(0, '#f0c890'); headGrad.addColorStop(1, '#c8905a');
    ctx.fillStyle = headGrad;
    ctx.beginPath(); ctx.ellipse(0, -12, 12, 14, 0, 0, Math.PI*2); ctx.fill();

    // Headband
    ctx.fillStyle = '#1a0030';
    ctx.beginPath(); ctx.roundRect(-13, -20, 26, 6, 2); ctx.fill();
    ctx.fillStyle = COL.gold;
    ctx.beginPath(); ctx.roundRect(-13, -21, 26, 2, 1); ctx.fill();
    // Gem in headband center (teardrop in teal)
    ctx.fillStyle = COL.teal;
    ctx.beginPath();
    ctx.arc(0, -18, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(-2, -12); ctx.lineTo(2, -12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(-1, -19, 1, 0, Math.PI*2); ctx.fill();

    // Hair - 3 bezier strands, spread based on state
    ctx.fillStyle = '#1a0010';
    const hairSpread = this.state === 'jump' ? 6 : this.state === 'fall' ? -2 : 0;
    // Strand 1
    ctx.beginPath();
    ctx.moveTo(8, -24);
    ctx.bezierCurveTo(18 + hairSpread, -22, 22 + hairSpread, -14, 18 + hairSpread*0.5, -4);
    ctx.bezierCurveTo(22 + hairSpread, -18, 24 + hairSpread, -28, 10, -26);
    ctx.closePath(); ctx.fill();
    // Strand 2
    ctx.fillStyle = '#2a0020';
    ctx.beginPath();
    ctx.moveTo(6, -23);
    ctx.bezierCurveTo(14 + hairSpread*0.8, -26, 20 + hairSpread*0.9, -20, 16 + hairSpread*0.4, -8);
    ctx.bezierCurveTo(18 + hairSpread*0.7, -22, 16 + hairSpread*0.8, -30, 8, -25);
    ctx.closePath(); ctx.fill();
    // Strand 3 (thin wisp)
    ctx.strokeStyle = '#150010'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(7, -22);
    ctx.bezierCurveTo(12 + hairSpread, -28, 18 + hairSpread*0.7, -25, 20 + hairSpread*0.5, -16);
    ctx.stroke();

    // Eye
    ctx.fillStyle = '#1a0830';
    ctx.beginPath(); ctx.ellipse(5, -12, 3, 2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(6, -12, 1.2, 1.2, 0, 0, Math.PI*2); ctx.fill();

    // Death X eyes
    if (this.state === 'death') {
      ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(3,-14); ctx.lineTo(7,-10); ctx.moveTo(7,-14); ctx.lineTo(3,-10); ctx.stroke();
    }

    // Jaw shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, -3, 8, 3, 0, 0, Math.PI); ctx.fill();
    ctx.restore();

    // === SCARF with 3-segment physics ===
    const velX = this.vx || 0;
    const velY = this.vy || 0;
    // Control points shift by velocity
    const scarfCpX = this.state === 'run' ? (this.facingRight ? -14 : 14) : (velX < -30 ? 10 : velX > 30 ? -10 : 0);
    const scarfCpY = this.state === 'jump' || velY < -100 ? 8 : this.state === 'fall' || velY > 100 ? -4 : 0;
    ctx.fillStyle = '#cc4400';
    ctx.beginPath();
    ctx.moveTo(-12, -44);
    ctx.bezierCurveTo(-16 + scarfCpX*0.3, -40 + scarfCpY*0.3, -18 + scarfCpX*0.7, -32 + scarfCpY*0.6, -14 + scarfCpX, -28 + scarfCpY);
    ctx.bezierCurveTo(-12 + scarfCpX*0.8, -26 + scarfCpY*0.8, -10 + scarfCpX*0.5, -28 + scarfCpY*0.5, -10, -32);
    ctx.bezierCurveTo(-10, -38, -8, -42, -8, -44);
    ctx.closePath(); ctx.fill();
    // Scarf highlight
    ctx.strokeStyle = '#ff6622'; ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-11, -43);
    ctx.bezierCurveTo(-15 + scarfCpX*0.3, -39, -16 + scarfCpX*0.6, -33 + scarfCpY*0.5, -13 + scarfCpX*0.8, -30 + scarfCpY*0.7);
    ctx.stroke();

    // === CRYSTAL CORONA ===
    if (this.crystalTimer > 0) {
      ctx.save();
      ctx.globalAlpha = 0.4 + 0.2 * Math.sin(t * 8);
      ctx.strokeStyle = COL.teal;
      ctx.shadowBlur = 10; ctx.shadowColor = COL.teal;
      // 8 radiating lines
      for (let ri = 0; ri < 8; ri++) {
        const ra = (ri / 8) * Math.PI * 2 + t * 2;
        const r1 = 28, r2 = 38 + Math.sin(t * 6 + ri) * 4;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ra)*r1, -26 + Math.sin(ra)*r1);
        ctx.lineTo(Math.cos(ra)*r2, -26 + Math.sin(ra)*r2);
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.restore(); // translate to base
  }
}

// =====================================================================
// ENEMY CLASS
// =====================================================================
class Enemy {
  constructor(x, y, patrolLeft, patrolRight) {
    this.x = x; this.y = y;
    this.w = 36; this.h = 56;
    this.vx = -60; this.vy = 0;
    this.facingRight = false;
    this.health = 3; this.maxHealth = 3;
    this.dead = false;
    this.patrolLeft = patrolLeft; this.patrolRight = patrolRight;
    this.state = 'patrol';
    this.attackTimer = 0;
    this.attackCooldown = 0;
    this.hurtTimer = 0;
    this.blockTimer = 0;
    this.blocking = false;
    this.animFrame = 0; this.animTimer = 0;
    this.onGround = false;
  }

  get hitbox() { return { x: this.x + 4, y: this.y, w: this.w - 8, h: this.h }; }
  get attackHitbox() {
    const reach = 50;
    if (this.facingRight) return { x: this.x + this.w, y: this.y + 10, w: reach, h: 36 };
    return { x: this.x - reach, y: this.y + 10, w: reach, h: 36 };
  }

  update(dt, player, level, audio, particles) {
    if (this.dead) {
      this.vy += GRAVITY * dt;
      this.y += this.vy * dt;
      return;
    }
    this.attackTimer = Math.max(0, this.attackTimer - dt);
    this.attackCooldown = Math.max(0, this.attackCooldown - dt);
    this.hurtTimer = Math.max(0, this.hurtTimer - dt);
    this.blockTimer = Math.max(0, this.blockTimer - dt);
    if (this.blockTimer <= 0) this.blocking = false;

    const distX = player.x - this.x;
    const distAbs = Math.abs(distX);

    if (!player.dead && distAbs < 220 && Math.abs(player.y - this.y) < 80) {
      this.state = 'aggro';
    } else if (distAbs >= 240) {
      this.state = 'patrol';
    }

    if (this.state === 'patrol') {
      if (this.x <= this.patrolLeft) { this.vx = 60; this.facingRight = true; }
      if (this.x >= this.patrolRight) { this.vx = -60; this.facingRight = false; }
    } else if (this.state === 'aggro') {
      this.facingRight = distX > 0;
      if (distAbs > 55) {
        this.vx = this.facingRight ? 110 : -110;
      } else {
        this.vx = 0;
        if (this.attackCooldown <= 0 && !this.blocking) {
          this.attackTimer = 0.5;
          this.attackCooldown = 1.5 + Math.random();
          if (Math.random() < 0.25) { this.blocking = true; this.blockTimer = 0.6; }
          if (aabbOverlap(this.attackHitbox, player.hitbox)) {
            player.takeDamage(audio, particles);
          }
        }
      }
    }

    this.vy += GRAVITY * dt;
    this.vy = Math.min(this.vy, 900);
    this.x += this.vx * dt;
    level.resolveX(this);
    this.onGround = false;
    this.y += this.vy * dt;
    level.resolveY(this, audio, particles);

    if (this.onGround && this.state === 'patrol') {
      if (!level.hasGroundAhead(this)) { this.vx *= -1; this.facingRight = !this.facingRight; }
    }

    this.animTimer += dt;
    if (this.animTimer > 0.12) { this.animFrame = (this.animFrame + 1) % 4; this.animTimer = 0; }
  }

  takeDamage(audio, particles) {
    if (this.blocking) { particles.sparks(this.x + this.w/2, this.y + 20); audio.swordHit(); return; }
    this.health--;
    this.hurtTimer = 0.3;
    audio.swordHit();
    particles.blood(this.x + this.w/2, this.y + this.h/2);
    if (this.health <= 0) {
      this.dead = true;
      this.vy = -300;
      audio.enemyDeath();
      particles.deathBurst(this.x + this.w/2, this.y + this.h/2, [COL.guardRed, COL.gold, '#fff']);
    }
  }

  draw(camX) {
    if (this.dead && this.y > 800) return;
    const sx = this.x - camX;
    const sy = this.y;

    ctx.save();
    if (this.hurtTimer > 0) { ctx.globalAlpha = 0.6; }

    ctx.save();
    if (!this.facingRight) {
      ctx.translate(sx + this.w/2, sy);
      ctx.scale(-1, 1);
      ctx.translate(-(sx + this.w/2), -sy);
    }
    this._drawGuard(sx, sy);
    ctx.restore();

    if (!this.dead && this.health < this.maxHealth) {
      ctx.fillStyle = '#333';
      ctx.fillRect(sx, sy - 12, this.w, 5);
      ctx.fillStyle = '#cc2200';
      ctx.fillRect(sx, sy - 12, this.w * this.health / this.maxHealth, 5);
    }
    if (this.blocking) {
      ctx.fillStyle = COL.gold; ctx.font = 'bold 12px Georgia';
      ctx.textAlign = 'center'; ctx.fillText('BLOCK', sx + this.w/2, sy - 16);
    }
    ctx.restore();
  }

  _drawGuard(sx, sy) {
    const t = Date.now() * 0.001;
    ctx.save();
    ctx.translate(sx + this.w/2, sy + this.h);

    // === CAPE (behind everything) ===
    ctx.save();
    const capeWave = Math.sin(t * 2.5 + this.x * 0.01) * 6;
    const capeWave2 = Math.sin(t * 1.8 + this.x * 0.01 + 1) * 4;
    ctx.fillStyle = '#6a0a0a';
    ctx.beginPath();
    ctx.moveTo(-14, -54);
    ctx.bezierCurveTo(-20 + capeWave*0.3, -44, -22 + capeWave*0.6, -20 + capeWave2, -18 + capeWave, 0);
    ctx.bezierCurveTo(-16 + capeWave*0.8, 2, -12, 0, -10, -2);
    ctx.bezierCurveTo(-12, -18 + capeWave2*0.5, -14 + capeWave*0.4, -40, -8, -54);
    ctx.closePath(); ctx.fill();
    // Cape highlight
    ctx.strokeStyle = '#8b1a1a'; ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-12, -52);
    ctx.bezierCurveTo(-17 + capeWave*0.3, -42, -18 + capeWave*0.5, -22 + capeWave2, -14 + capeWave*0.8, -4);
    ctx.stroke();
    ctx.restore();

    // === LEGS ===
    const legSwing = (Math.abs(this.vx) > 20) ? Math.sin(this.animFrame * Math.PI / 2) * 10 : 0;
    const legGrad = ctx.createLinearGradient(-6, -30, 6, 0);
    legGrad.addColorStop(0, '#5a0000'); legGrad.addColorStop(1, '#2a0000');
    // Back leg
    ctx.save(); ctx.rotate(-legSwing * Math.PI/180);
    ctx.fillStyle = legGrad; ctx.beginPath(); ctx.roundRect(-6, -30, 12, 30, 3); ctx.fill();
    // Knee guard back
    ctx.fillStyle = '#8b1a1a';
    ctx.beginPath(); ctx.arc(0, -16, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 0.7; ctx.stroke();
    ctx.restore();
    // Front leg
    ctx.save(); ctx.rotate(legSwing * Math.PI/180);
    ctx.fillStyle = '#6a0a0a'; ctx.beginPath(); ctx.roundRect(-5, -30, 12, 30, 3); ctx.fill();
    // Knee guard front
    ctx.fillStyle = '#8b1a1a';
    ctx.beginPath(); ctx.arc(1, -16, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 0.7; ctx.stroke();
    // Boot
    ctx.fillStyle = '#3a0000'; ctx.beginPath(); ctx.ellipse(6, 0, 9, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // Armored skirt / lamellar plates (hanging below belt)
    for (let lp = 0; lp < 5; lp++) {
      const lpX = -12 + lp * 6;
      const lpWave = Math.sin(t * 2 + lp * 0.5) * 1.5;
      ctx.fillStyle = lp % 2 === 0 ? '#6a0a0a' : '#5a0000';
      ctx.beginPath(); ctx.roundRect(lpX, -32 + lpWave, 5, 10, 1); ctx.fill();
      ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 0.5; ctx.strokeRect(lpX, -32 + lpWave, 5, 10);
    }

    // === BODY ARMOR ===
    const armorGrad = ctx.createLinearGradient(-16, -56, 16, -30);
    armorGrad.addColorStop(0, '#8b1a1a'); armorGrad.addColorStop(0.5, '#6a0a0a'); armorGrad.addColorStop(1, '#3a0000');
    ctx.fillStyle = armorGrad;
    ctx.beginPath(); ctx.roundRect(-16, -56, 32, 26, [3,3,8,8]); ctx.fill();
    // Armor plates
    ctx.strokeStyle = COL.gold; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-16, -46); ctx.lineTo(16, -46); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-16, -36); ctx.lineTo(16, -36); ctx.stroke();
    // Geometric star engravings on chest (dark gold)
    ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 0.7;
    for (let sp = 0; sp < 6; sp++) {
      const sa = (sp / 6) * Math.PI * 2;
      const sa2 = sa + Math.PI / 6;
      ctx.beginPath(); ctx.moveTo(Math.cos(sa)*4, -43 + Math.sin(sa)*4); ctx.lineTo(Math.cos(sa2)*7, -43 + Math.sin(sa2)*7); ctx.stroke();
    }
    // Center emblem
    ctx.fillStyle = COL.gold;
    ctx.beginPath(); ctx.arc(0, -43, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8b0000'; ctx.beginPath(); ctx.arc(0, -43, 3, 0, Math.PI*2); ctx.fill();

    // Shoulder pauldrons
    ctx.save();
    ctx.translate(16, -54);
    ctx.fillStyle = '#8b1a1a';
    ctx.beginPath(); ctx.arc(0, 0, 10, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 0.8;
    for (let ri = 1; ri < 4; ri++) {
      const ra = Math.PI + (ri / 4) * Math.PI;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(ra)*10, Math.sin(ra)*10); ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.translate(-16, -54);
    ctx.fillStyle = '#8b1a1a';
    ctx.beginPath(); ctx.arc(0, 0, 10, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 0.8;
    for (let ri = 1; ri < 4; ri++) {
      const ra = (ri / 4) * Math.PI;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(ra)*10, Math.sin(ra)*10); ctx.stroke();
    }
    ctx.restore();

    // === SPEAR ARM ===
    const attackAngle = this.attackTimer > 0 ? 30 : 0;
    ctx.save();
    ctx.translate(14, -50);
    ctx.rotate(attackAngle * Math.PI/180);
    // Spear shaft
    ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(10, -60); ctx.stroke();
    // Leather wrap (zig-zag brown)
    ctx.strokeStyle = '#5a2a00'; ctx.lineWidth = 1.5;
    for (let lw = 0; lw < 30; lw += 5) {
      const frac = lw / 70;
      const wx = 0 + 10 * frac;
      const wy = 10 - 70 * frac;
      ctx.beginPath(); ctx.moveTo(wx - 2, wy); ctx.lineTo(wx + 3, wy - 3); ctx.stroke();
    }
    // Pennant flag
    ctx.fillStyle = COL.goldDark;
    ctx.beginPath(); ctx.moveTo(5, -30); ctx.lineTo(14, -25); ctx.lineTo(5, -20); ctx.closePath(); ctx.fill();
    // Spear tip (broader diamond)
    ctx.fillStyle = '#ccc'; ctx.shadowBlur = 4; ctx.shadowColor = '#fff';
    ctx.beginPath();
    ctx.moveTo(6, -56); ctx.lineTo(15, -62); ctx.lineTo(11, -78); ctx.lineTo(7, -62); ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // Blood drip on tip
    ctx.fillStyle = '#8b0000';
    ctx.beginPath(); ctx.arc(10, -78, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9, -78); ctx.lineTo(9, -83); ctx.lineTo(11, -80); ctx.closePath(); ctx.fill();
    // Tassel
    ctx.fillStyle = COL.guardRed; ctx.beginPath(); ctx.arc(10, -56, 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // Shield arm (if blocking)
    if (this.blocking) {
      ctx.save();
      ctx.translate(-14, -48);
      const shieldGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
      shieldGrad.addColorStop(0, COL.gold); shieldGrad.addColorStop(1, COL.goldDark);
      ctx.fillStyle = shieldGrad;
      ctx.shadowBlur = 10; ctx.shadowColor = COL.gold;
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    }

    // === HEAD / HELMET ===
    ctx.save();
    ctx.translate(0, -56);
    // Helmet
    const helmGrad = ctx.createLinearGradient(-13, -16, 13, 0);
    helmGrad.addColorStop(0, '#8b1a1a'); helmGrad.addColorStop(0.5, '#5a0000'); helmGrad.addColorStop(1, '#3a0000');
    ctx.fillStyle = helmGrad;
    ctx.beginPath(); ctx.ellipse(0, -8, 13, 16, 0, 0, Math.PI*2); ctx.fill();
    // Helmet ridge
    ctx.fillStyle = COL.gold; ctx.beginPath(); ctx.roundRect(-2, -24, 4, 20, 2); ctx.fill();

    // Plume / crest (red+gold feathers)
    for (let fp = 0; fp < 5; fp++) {
      const fpAngle = (fp - 2) * 0.2 + Math.sin(t * 2 + fp * 0.4) * 0.08;
      ctx.save();
      ctx.translate(0, -24);
      ctx.rotate(fpAngle);
      const plumeGrad = ctx.createLinearGradient(0, 0, 0, -18);
      plumeGrad.addColorStop(0, fp % 2 === 0 ? '#cc1111' : '#b8860b');
      plumeGrad.addColorStop(1, fp % 2 === 0 ? '#ff4422' : '#ffd700');
      ctx.fillStyle = plumeGrad;
      ctx.beginPath();
      ctx.moveTo(-2, 0); ctx.bezierCurveTo(-4 + fp*0.4, -8, -2 + fp*0.3, -14, 0 + fp*0.2, -18);
      ctx.bezierCurveTo(2 - fp*0.2, -14, 3 - fp*0.3, -8, 2, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // Visor / cheek guards
    ctx.fillStyle = '#1a0000'; ctx.beginPath(); ctx.roundRect(-10, -12, 20, 8, 2); ctx.fill();
    // Chin strap
    ctx.strokeStyle = '#3a0000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, -4); ctx.quadraticCurveTo(0, 2, 10, -4); ctx.stroke();
    // 3 horizontal visor slits
    ctx.fillStyle = '#ff2200'; ctx.shadowBlur = 6; ctx.shadowColor = '#ff0000';
    ctx.beginPath(); ctx.roundRect(-8, -11, 5, 1.5, 0.5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-8, -9, 5, 1.5, 0.5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-8, -7, 5, 1.5, 0.5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(3, -11, 5, 1.5, 0.5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(3, -9, 5, 1.5, 0.5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(3, -7, 5, 1.5, 0.5); ctx.fill();
    ctx.shadowBlur = 0;
    // Cheek guards
    ctx.fillStyle = helmGrad;
    ctx.beginPath(); ctx.roundRect(-14, -14, 5, 14, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(9, -14, 5, 14, 2); ctx.fill();
    ctx.restore();

    ctx.restore();
  }
}

// =====================================================================
// LEVEL CLASS
// =====================================================================
class Level {
  constructor() {
    this.width = 5000;
    this.tiles = [];
    this.spikes = [];
    this.pendulums = [];
    this.torches = [];
    this.crystals = [];
    this.portal = null;
    this.enemies = [];
    this.pressurePlates = [];
    this.ceilingBlocks = [];
    this._build();
  }

  _build() {
    const T = TILE;
    // Ground floor
    for (let x = 0; x < 5000; x += T) {
      const inSpikeGap1 = x >= 14*T && x < 18*T;
      const inSpikeGap2 = x >= 30*T && x < 33*T;
      const inSpikeGap3 = x >= 60*T && x < 64*T;
      if (!inSpikeGap1 && !inSpikeGap2 && !inSpikeGap3) {
        this.tiles.push({ x, y: 520, w: T, h: 80, type: 'ground' });
      }
    }

    // Floating platforms
    const plats = [
      [4,420,4],[8,360,3],[12,300,3],
      [20,400,4],[24,460,3],
      [28,380,3],
      [34,420,3],[38,350,4],[42,280,3],
      [46,380,3],[48,460,2],
      [52,350,4],[56,420,3],
      [65,400,4],[70,340,4],
      [74,400,3],[78,340,3],[82,280,4],
      [86,360,3],[90,420,4],[94,350,3],
      [98,300,4],[100,240,3],
    ];
    for (const [tx, ty, tw] of plats) {
      for (let i = 0; i < tw; i++) {
        this.tiles.push({ x: tx*T + i*T, y: ty, w: T, h: 20, type: 'platform' });
      }
    }

    // Spike pits
    for (let sx = 14*T; sx < 18*T; sx += T) this.spikes.push({ x: sx+4, y: 504, w: T-8, h: 20 });
    for (let sx = 30*T; sx < 33*T; sx += T) this.spikes.push({ x: sx+4, y: 504, w: T-8, h: 20 });
    for (let sx = 60*T; sx < 64*T; sx += T) this.spikes.push({ x: sx+4, y: 504, w: T-8, h: 20 });

    // Pendulum traps
    this.pendulums.push({ x: 52*T+T*2, pivotY: 200, length: 180, angle: 0, speed: 1.8, timer: 0 });
    this.pendulums.push({ x: 54*T+T*1, pivotY: 220, length: 160, angle: Math.PI, speed: 2.0, timer: 1.5 });

    // Pressure plates
    this.pressurePlates.push({ x: 46*T, y: 454, w: T*2, triggered: false, timer: 0 });
    for (let i = 0; i < 4; i++) {
      this.ceilingBlocks.push({ x: 46*T + i*T, y: 280, w: T, h: T, active: false, vy: 0, fallen: false });
    }

    // Torches
    for (let tx = 200; tx < 5000; tx += 220) this.torches.push({ x: tx, y: 440 });

    // Time crystals
    this.crystals.push({ x: 22*T, y: 370, collected: false });
    this.crystals.push({ x: 68*T, y: 310, collected: false });

    // Portal
    this.portal = { x: 101*T, y: 180, w: 56, h: 80 };

    // Enemies
    this.enemies.push(new Enemy(36*T, 520-56, 34*T, 40*T));
    this.enemies.push(new Enemy(72*T, 520-56, 68*T, 78*T));
    this.enemies.push(new Enemy(94*T, 520-56, 90*T, 98*T));
  }

  resolveX(ent) {
    const hb = ent.hitbox || { x: ent.x, y: ent.y, w: ent.w, h: ent.h };
    for (const t of this.tiles) {
      if (aabbOverlap(hb, t)) {
        if (ent.vx > 0) ent.x = t.x - (ent.hitbox ? ent.w - (hb.x - ent.x) : ent.w);
        else if (ent.vx < 0) ent.x = t.x + t.w - (hb.x - ent.x);
        ent.vx = 0;
      }
    }
  }

  resolveY(ent, audio, particles) {
    const hb = ent.hitbox || { x: ent.x, y: ent.y, w: ent.w, h: ent.h };
    for (const t of this.tiles) {
      if (aabbOverlap(hb, t)) {
        if (ent.vy > 0) {
          ent.y = t.y - ent.h;
          ent.vy = 0;
          ent.onGround = true;
        } else if (ent.vy < 0) {
          ent.y = t.y + t.h - (hb.y - ent.y);
          ent.vy = 0;
        }
      }
    }
    for (const cb of this.ceilingBlocks) {
      if (!cb.fallen) continue;
      const cbt = { x: cb.x, y: cb.y, w: cb.w, h: cb.h };
      if (aabbOverlap(hb, cbt)) {
        if (ent.vy > 0) { ent.y = cb.y - ent.h; ent.vy = 0; ent.onGround = true; }
        else if (ent.vy < 0) { ent.y = cb.y + cb.h; ent.vy = 0; }
      }
    }
    if (ent instanceof Player && !ent.dead) {
      for (const s of this.spikes) {
        if (aabbOverlap(hb, s)) { ent.die(audio || {spikeDeath:()=>{}}, particles || {deathBurst:()=>{}}); break; }
      }
    }
  }

  checkWallLeft(ent) {
    const probeLeft = { x: ent.x - 4, y: ent.y + 10, w: 4, h: ent.h - 20 };
    return this.tiles.some(t => aabbOverlap(probeLeft, t));
  }
  checkWallRight(ent) {
    const probeRight = { x: ent.x + ent.w, y: ent.y + 10, w: 4, h: ent.h - 20 };
    return this.tiles.some(t => aabbOverlap(probeRight, t));
  }

  hasGroundAhead(enemy) {
    const probeX = enemy.vx > 0 ? enemy.x + enemy.w + 4 : enemy.x - 4;
    const probe = { x: probeX, y: enemy.y + enemy.h + 4, w: 4, h: 8 };
    return this.tiles.some(t => aabbOverlap(probe, t));
  }

  checkPortal(player) {
    if (!this.portal) return false;
    return aabbOverlap(player.hitbox, this.portal);
  }

  update(dt, player, audio, particles) {
    for (const p of this.pendulums) {
      p.timer += dt;
      p.angle = Math.sin(p.timer * p.speed) * 1.1;
      const tipX = p.x + Math.sin(p.angle) * p.length;
      const tipY = p.pivotY + Math.cos(p.angle) * p.length;
      const blade = { x: tipX - 20, y: tipY - 8, w: 40, h: 16 };
      if (!player.dead && aabbOverlap(player.hitbox, blade)) player.takeDamage(audio, particles);
    }

    for (const pp of this.pressurePlates) {
      if (pp.triggered) { pp.timer = Math.max(0, pp.timer - dt); continue; }
      const ppHit = { x: pp.x, y: pp.y, w: pp.w, h: 8 };
      if (aabbOverlap(player.hitbox, ppHit)) {
        pp.triggered = true; pp.timer = 0.5;
        for (const cb of this.ceilingBlocks) { cb.active = true; }
      }
    }
    for (const cb of this.ceilingBlocks) {
      if (cb.active && !cb.fallen) {
        cb.vy = (cb.vy || 0) + GRAVITY * dt;
        cb.y += cb.vy * dt;
        if (cb.y >= 380) { cb.y = 380; cb.fallen = true; cb.active = false; }
      }
    }

    for (const c of this.crystals) {
      if (!c.collected && aabbOverlap(player.hitbox, { x: c.x, y: c.y, w: 24, h: 24 })) {
        c.collected = true;
        player.crystalTimer = 6.0;
        audio.portal();
        particles.deathBurst(c.x + 12, c.y + 12, [COL.teal, '#aaffee', '#fff']);
      }
    }

    for (const e of this.enemies) {
      e.update(dt, player, this, audio, particles);
      if (!e.dead && player.attackTimer > 0.2 && player.attackTimer < 0.35) {
        if (aabbOverlap(player.attackHitbox, e.hitbox)) {
          e.takeDamage(audio, particles);
        }
      }
    }
  }

  drawBackground(camX, t) {
    // === SKY GRADIENT ===
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#03000f');
    skyGrad.addColorStop(0.4, '#0a0025');
    skyGrad.addColorStop(0.7, '#120040');
    skyGrad.addColorStop(1, '#1a0050');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // === AURORA BANDS ===
    ctx.save();
    for (let ab = 0; ab < 4; ab++) {
      const auroraY = 80 + ab * 55;
      const auroraAlpha = 0.04 + 0.03 * Math.sin(t * 0.4 + ab * 1.2);
      const auroraW = W * (0.6 + 0.2 * Math.sin(t * 0.3 + ab));
      const auroraX = W * 0.5 + Math.sin(t * 0.25 + ab * 0.8) * W * 0.25;
      const colors = ['#6600ff', '#aa00cc', '#00ccaa', '#4400aa'];
      const color = colors[ab % colors.length];
      ctx.globalAlpha = auroraAlpha;
      const aGrad = ctx.createRadialGradient(auroraX, auroraY, 0, auroraX, auroraY, auroraW * 0.5);
      aGrad.addColorStop(0, color);
      aGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = aGrad;
      ctx.beginPath();
      ctx.ellipse(auroraX, auroraY, auroraW * 0.5, 40 + 10 * Math.sin(t * 0.5 + ab), 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // === STAR FIELD ===
    ctx.save();
    const starOff = camX * 0.05;
    for (let i = 0; i < STARS.length; i++) {
      const s = STARS[i];
      // Cluster in upper-right: shift those stars there
      let sx, sy;
      if (s.cluster) {
        sx = (W * 0.75 + (i - 155) * 11 + starOff * 0.5) % W;
        sy = 30 + ((i - 155) * 7) % (H * 0.18);
      } else {
        sx = ((s.x + starOff) % W + W) % W;
        sy = s.y;
      }
      const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(t * 1.2 + s.twinkleOffset));
      ctx.globalAlpha = twinkle * 0.9;

      if (s.size >= 1.5) {
        // Large star with lens-flare cross
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 6; ctx.shadowColor = '#aaccff';
        ctx.beginPath(); ctx.arc(sx, sy, s.size, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(180,210,255,0.6)';
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(sx - s.size*3, sy); ctx.lineTo(sx + s.size*3, sy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx, sy - s.size*3); ctx.lineTo(sx, sy + s.size*3); ctx.stroke();
      } else {
        ctx.fillStyle = s.size < 0.5 ? '#aabbff' : '#ddeeff';
        ctx.beginPath(); ctx.arc(sx, sy, s.size, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;

    // Shooting star
    if (!_shootingStar.active && Math.random() < 0.0008) {
      _shootingStar = { active: true, x: Math.random() * W * 0.7, y: Math.random() * H * 0.3, vx: 220, vy: 100, life: 1 };
    }
    if (_shootingStar.active) {
      _shootingStar.x += _shootingStar.vx * 0.016;
      _shootingStar.y += _shootingStar.vy * 0.016;
      _shootingStar.life -= 0.016;
      if (_shootingStar.life <= 0 || _shootingStar.x > W) _shootingStar.active = false;
      else {
        ctx.save();
        ctx.globalAlpha = _shootingStar.life * 0.8;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 4; ctx.shadowColor = '#aaddff';
        ctx.beginPath();
        ctx.moveTo(_shootingStar.x, _shootingStar.y);
        ctx.lineTo(_shootingStar.x - 30, _shootingStar.y - 13);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();
      }
    }
    ctx.restore();

    // === MOON ===
    const moonX = W * 0.82 - camX * 0.04;
    const moonY = 65;
    // Outer halo rings
    for (let hr = 0; hr < 2; hr++) {
      ctx.save();
      ctx.globalAlpha = 0.06 - hr * 0.02;
      ctx.strokeStyle = '#ffe890';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(moonX, moonY, 50 + hr * 16, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    // Moon glow
    const moonGrad = ctx.createRadialGradient(moonX-8, moonY-8, 5, moonX, moonY, 40);
    moonGrad.addColorStop(0, '#fffce8'); moonGrad.addColorStop(0.7, '#f0d060'); moonGrad.addColorStop(1, 'transparent');
    ctx.shadowBlur = 40; ctx.shadowColor = '#ffdd8888';
    ctx.fillStyle = moonGrad;
    ctx.beginPath(); ctx.arc(moonX, moonY, 38, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // 8 moon rays
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.strokeStyle = '#ffee99';
    ctx.lineWidth = 1.5;
    for (let mr = 0; mr < 8; mr++) {
      const ra = (mr / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(moonX + Math.cos(ra)*40, moonY + Math.sin(ra)*40);
      ctx.lineTo(moonX + Math.cos(ra)*62, moonY + Math.sin(ra)*62);
      ctx.stroke();
    }
    ctx.restore();
    // Moon craters
    ctx.globalAlpha = 0.15; ctx.fillStyle = '#8060a0';
    ctx.beginPath(); ctx.arc(moonX+10, moonY+5, 8, 0, Math.PI*2); ctx.fill();
    // Inner darker crater + highlight arc
    ctx.fillStyle = '#5040708';
    ctx.beginPath(); ctx.arc(moonX+10, moonY+5, 5, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.25; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(moonX+8, moonY+3, 5, Math.PI*1.1, Math.PI*1.7); ctx.stroke();
    ctx.beginPath(); ctx.arc(moonX-8, moonY-10, 5, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    // === LAYER 2: Distant palace silhouettes ===
    ctx.save();
    ctx.translate(-camX * 0.12, 0);
    this._drawPalaceSilhouettes(t);
    ctx.restore();

    // === LAYER 3: Mountains (0.22x parallax) ===
    ctx.save();
    ctx.translate(-camX * 0.22, 0);
    this._drawMountainRange();
    ctx.restore();

    // === LAYER 4: Near ruin columns (0.35x parallax) ===
    ctx.save();
    ctx.translate(-camX * 0.35, 0);
    this._drawRuinColumns(t);
    ctx.restore();

    // === GROUND FOG ===
    ctx.save();
    const fogOff = camX * 0.3;
    const fogWave = Math.sin(t * 0.6) * 6;
    const fogGrad = ctx.createLinearGradient(0, 478 + fogWave, 0, 522);
    fogGrad.addColorStop(0, 'transparent');
    fogGrad.addColorStop(1, 'rgba(80,40,120,0.18)');
    ctx.fillStyle = fogGrad;
    ctx.save();
    ctx.translate(-fogOff % W, 0);
    ctx.fillRect(-W, 478 + fogWave, W * 4, 44);
    ctx.restore();
    ctx.restore();
  }

  _drawMountainRange() {
    const mountainGrad = ctx.createLinearGradient(0, 300, 0, 520);
    mountainGrad.addColorStop(0, '#120022'); mountainGrad.addColorStop(1, '#0a0018');
    ctx.fillStyle = mountainGrad;
    ctx.beginPath();
    ctx.moveTo(0, 520);
    // Jagged peaks across the world width
    const peaks = [];
    for (let mx = 0; mx <= 5000 * 0.22 + W + 200; mx += 80) {
      const peakH = 120 + Math.sin(mx * 0.013) * 80 + Math.cos(mx * 0.031) * 40;
      peaks.push([mx, 520 - peakH]);
    }
    ctx.moveTo(peaks[0][0], 520);
    for (let pi = 0; pi < peaks.length - 1; pi++) {
      const [x1, y1] = peaks[pi];
      const [x2, y2] = peaks[pi + 1];
      const midX = (x1 + x2) / 2;
      // Jagged: add a sub-peak
      const subH = Math.min(y1, y2) - 20 + Math.sin(pi * 2.7) * 15;
      ctx.lineTo(x1, y1);
      ctx.lineTo(midX, Math.min(subH, Math.min(y1, y2)));
    }
    ctx.lineTo(peaks[peaks.length-1][0], peaks[peaks.length-1][1]);
    ctx.lineTo(peaks[peaks.length-1][0], 520);
    ctx.closePath();
    ctx.fill();
    // Snow caps on highest peaks
    ctx.fillStyle = 'rgba(220,210,255,0.12)';
    for (let pi = 0; pi < peaks.length; pi++) {
      if (peaks[pi][1] < 360) {
        ctx.beginPath();
        ctx.moveTo(peaks[pi][0], peaks[pi][1]);
        ctx.lineTo(peaks[pi][0] - 12, peaks[pi][1] + 20);
        ctx.lineTo(peaks[pi][0] + 12, peaks[pi][1] + 20);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  _drawPalaceSilhouettes(t) {
    const palaceGrad = ctx.createLinearGradient(0, 180, 0, 520);
    palaceGrad.addColorStop(0, '#1a0035'); palaceGrad.addColorStop(1, '#0a0020');
    const buildings = [
      { x: 80,   w: 300, h: 280 },
      { x: 450,  w: 200, h: 240 },
      { x: 700,  w: 350, h: 300 },
      { x: 1100, w: 250, h: 260 },
      { x: 1400, w: 180, h: 220 },
      { x: 1650, w: 320, h: 270 },
      { x: 2020, w: 210, h: 245 },
      { x: 2300, w: 280, h: 295 },
    ];
    for (const b of buildings) {
      ctx.fillStyle = palaceGrad;
      ctx.beginPath();
      ctx.rect(b.x, 520 - b.h, b.w, b.h);
      ctx.fill();
      // Dome
      ctx.beginPath();
      ctx.arc(b.x + b.w/2, 520 - b.h, b.w/2.5, Math.PI, 0);
      ctx.fill();
      // Minaret
      ctx.fillRect(b.x + b.w - 20, 520 - b.h - 80, 14, 80);
      ctx.beginPath(); ctx.moveTo(b.x + b.w - 13, 520 - b.h - 80);
      ctx.lineTo(b.x + b.w - 6, 520 - b.h - 120); ctx.lineTo(b.x + b.w + 1, 520 - b.h - 80); ctx.fill();
      // Second minaret
      ctx.fillRect(b.x + 6, 520 - b.h - 60, 10, 60);
      ctx.beginPath(); ctx.moveTo(b.x + 6, 520 - b.h - 60);
      ctx.lineTo(b.x + 11, 520 - b.h - 95); ctx.lineTo(b.x + 16, 520 - b.h - 60); ctx.fill();
      // Balcony details
      ctx.strokeStyle = '#2a0050'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(b.x + 10, 520 - b.h + 60); ctx.lineTo(b.x + b.w - 10, 520 - b.h + 60); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(b.x + 10, 520 - b.h + 65); ctx.lineTo(b.x + b.w - 10, 520 - b.h + 65); ctx.stroke();
      // Glowing ornament dots along rooflines
      for (let od = b.x + 20; od < b.x + b.w - 10; od += 18) {
        const pulse = 0.3 + 0.2 * Math.sin(t * 2.5 + od * 0.05);
        ctx.save();
        ctx.globalAlpha = pulse;
        ctx.fillStyle = '#ffaa44';
        ctx.shadowBlur = 4; ctx.shadowColor = '#ffaa44';
        ctx.beginPath(); ctx.arc(od, 520 - b.h - 2, 1.5, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }
      // Pointed arch windows with animated glow
      for (let wx = b.x + 20; wx < b.x + b.w - 10; wx += 35) {
        const wh = 30, ww = 16;
        const wy = 520 - b.h + 40;
        const windowPulse = 0.15 + 0.12 * Math.sin(t * 1.8 + wx * 0.08);
        ctx.save();
        ctx.globalAlpha = windowPulse;
        ctx.fillStyle = '#ffdd44';
        ctx.shadowBlur = 8; ctx.shadowColor = '#ffcc00';
        ctx.beginPath();
        ctx.rect(wx, wy, ww, wh);
        ctx.arc(wx + ww/2, wy, ww/2, Math.PI, 0);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
        // Dark window outline
        ctx.fillStyle = '#2a0060';
        ctx.beginPath();
        ctx.rect(wx+1, wy+1, ww-2, wh-2);
        ctx.arc(wx + ww/2, wy, ww/2 - 1, Math.PI, 0);
        ctx.fill();
      }
    }
  }

  _drawRuinColumns(t) {
    for (let cx = 0; cx < 5000 * 0.35 + W; cx += 180) {
      const colH = 250 + Math.sin(cx * 0.01) * 80;
      const colX = cx;
      const colW = 38;

      // Column shaft with gradient
      const colGrad = ctx.createLinearGradient(colX, 0, colX + colW, 0);
      colGrad.addColorStop(0, '#2a1840'); colGrad.addColorStop(0.4, '#3d2858'); colGrad.addColorStop(1, '#1a1028');
      ctx.fillStyle = colGrad;
      ctx.fillRect(colX + 6, 520 - colH, colW - 8, colH);

      // Fluting (8 grooves)
      ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 0.8;
      for (let fi = 1; fi < 8; fi++) {
        ctx.beginPath();
        ctx.moveTo(colX + 6 + fi * (colW-8)/8, 520 - colH);
        ctx.lineTo(colX + 6 + fi * (colW-8)/8, 520);
        ctx.stroke();
      }

      // Golden decorative capital
      ctx.fillStyle = '#3d2858';
      ctx.fillRect(colX, 520 - colH, colW, 18);
      // Capital gold details
      ctx.fillStyle = COL.goldDark;
      ctx.beginPath(); ctx.roundRect(colX + 2, 520 - colH - 8, colW - 4, 10, 2); ctx.fill();
      ctx.strokeStyle = COL.gold; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(colX + 4, 520 - colH - 2); ctx.lineTo(colX + colW - 4, 520 - colH - 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(colX + 4, 520 - colH + 5); ctx.lineTo(colX + colW - 4, 520 - colH + 5); ctx.stroke();
      // Small gold volute scrolls on capital
      ctx.strokeStyle = COL.gold; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.arc(colX + 8, 520 - colH + 9, 3, Math.PI * 0.5, Math.PI * 2.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(colX + colW - 8, 520 - colH + 9, 3, Math.PI * 0.5, Math.PI * 2.5); ctx.stroke();

      // Horizontal entablature (connecting column tops)
      ctx.fillStyle = '#2a1840';
      ctx.fillRect(colX - 20, 520 - colH - 10, colW + 40, 8);
      ctx.strokeStyle = '#3d2858'; ctx.lineWidth = 1;
      ctx.strokeRect(colX - 20, 520 - colH - 10, colW + 40, 8);

      // Crack detail
      ctx.strokeStyle = '#1a1028'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(colX + 12, 520 - colH * 0.6);
      ctx.lineTo(colX + 18, 520 - colH * 0.45);
      ctx.lineTo(colX + 14, 520 - colH * 0.3);
      ctx.stroke();

      // Hanging vines/moss (dark green bezier)
      if (Math.sin(cx * 0.04) > 0) {
        ctx.strokeStyle = '#1a3a0a'; ctx.lineWidth = 1.2;
        for (let vi = 0; vi < 3; vi++) {
          const vx2 = colX + 10 + vi * 8;
          const vLen = 20 + Math.sin(cx * 0.02 + vi) * 15;
          ctx.beginPath();
          ctx.moveTo(vx2, 520 - colH + 14);
          ctx.bezierCurveTo(vx2 + 4, 520 - colH + 20, vx2 - 3, 520 - colH + vLen - 5, vx2 + 2, 520 - colH + vLen);
          ctx.stroke();
          // Leaf blob
          ctx.fillStyle = '#1a4a0a';
          ctx.beginPath(); ctx.ellipse(vx2 + 2, 520 - colH + vLen, 3, 2, 0.3, 0, Math.PI*2); ctx.fill();
        }
      }

      // Rubble at base
      ctx.fillStyle = '#2a1840';
      for (let rb = 0; rb < 3; rb++) {
        const rbx = colX + rb * 10 - 4;
        const rbw = 6 + Math.sin(cx + rb) * 3;
        const rbh = 3 + Math.sin(cx * 0.1 + rb) * 2;
        ctx.beginPath(); ctx.ellipse(rbx, 520, rbw, rbh, 0, 0, Math.PI*2); ctx.fill();
      }

      // Broken top (some columns)
      if (Math.sin(cx * 0.05) > 0.3) {
        ctx.fillStyle = '#2a1840';
        ctx.beginPath();
        ctx.moveTo(colX + 6, 520 - colH);
        ctx.lineTo(colX + colW - 8, 520 - colH);
        ctx.lineTo(colX + colW - 12, 520 - colH - 20);
        ctx.lineTo(colX + 10, 520 - colH - 14);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  drawTiles(camX) {
    const runeShapes = [
      // 5 rune designs as draw functions (sx, sy center)
      (x, y) => { ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,y-5); ctx.lineTo(x,y+5); ctx.moveTo(x-5,y); ctx.lineTo(x+5,y); ctx.stroke(); },
      (x, y) => { ctx.beginPath(); ctx.moveTo(x,y-5); ctx.lineTo(x+4,y+3); ctx.lineTo(x-4,y+3); ctx.closePath(); ctx.stroke(); },
      (x, y) => { for(let i=0;i<6;i++){const a=i/6*Math.PI*2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*5, y+Math.sin(a)*5); ctx.stroke();} },
      (x, y) => { ctx.beginPath(); ctx.moveTo(x-4,y-4); ctx.lineTo(x+4,y+4); ctx.moveTo(x+4,y-4); ctx.lineTo(x-4,y+4); ctx.stroke(); ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.stroke(); },
      (x, y) => { ctx.beginPath(); ctx.rect(x-3,y-3,6,6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x-5,y); ctx.lineTo(x+5,y); ctx.stroke(); },
    ];

    for (const t of this.tiles) {
      const sx = t.x - camX;
      if (sx > W + 50 || sx + t.w < -50) continue;

      if (t.type === 'ground') {
        // Stone ground block with gradient
        const stoneGrad = ctx.createLinearGradient(sx, t.y, sx, t.y + t.h);
        stoneGrad.addColorStop(0, '#4a3a5a'); stoneGrad.addColorStop(0.3, '#3a2a4a'); stoneGrad.addColorStop(1, '#1a1028');
        ctx.fillStyle = stoneGrad;
        ctx.fillRect(sx, t.y, t.w, t.h);

        // Edge beveling
        // Top bright edge
        ctx.fillStyle = '#6a5a7a';
        ctx.fillRect(sx, t.y, t.w, 3);
        // Right mid edge
        ctx.fillStyle = 'rgba(90,70,110,0.5)';
        ctx.fillRect(sx + t.w - 3, t.y, 3, t.h);
        // Bottom dark edge
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(sx, t.y + t.h - 3, t.w, 3);
        // Left dark edge
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(sx, t.y, 3, t.h);

        // Mortar lines per block
        ctx.strokeStyle = '#2a1a3a'; ctx.lineWidth = 1;
        for (let bx = sx; bx < sx + t.w; bx += TILE) {
          ctx.strokeRect(bx + 1, t.y + 1, TILE - 2, TILE - 2);
        }

        // Persian geometric tile pattern (thin gold lines)
        ctx.strokeStyle = 'rgba(180,140,0,0.18)'; ctx.lineWidth = 0.7;
        for (let bx = sx; bx < sx + t.w; bx += TILE) {
          const cx2 = bx + TILE/2, cy2 = t.y + TILE/2;
          // Star pattern: 8-point star outline using 2 rotated squares
          for (let rot = 0; rot < 2; rot++) {
            ctx.beginPath();
            for (let si = 0; si < 4; si++) {
              const sa = (si / 4) * Math.PI * 2 + rot * Math.PI/4;
              const r = 10;
              if (si === 0) ctx.moveTo(cx2 + Math.cos(sa)*r, cy2 + Math.sin(sa)*r);
              else ctx.lineTo(cx2 + Math.cos(sa)*r, cy2 + Math.sin(sa)*r);
            }
            ctx.closePath(); ctx.stroke();
          }
          // Inner circle
          ctx.beginPath(); ctx.arc(cx2, cy2, 4, 0, Math.PI*2); ctx.stroke();
        }

        // Glowing rune (teal, different per block)
        for (let bx = sx; bx < sx + t.w; bx += TILE) {
          const runeIdx = Math.floor(((t.x + bx - sx) / TILE) % 5);
          const rcx = bx + TILE/2, rcy = t.y + TILE/2 + 8;
          ctx.save();
          ctx.strokeStyle = 'rgba(0,200,160,0.25)'; ctx.lineWidth = 0.8;
          ctx.shadowBlur = 4; ctx.shadowColor = COL.teal;
          runeShapes[runeIdx](rcx, rcy);
          ctx.shadowBlur = 0;
          ctx.restore();
        }

        // Horizontal crack lines
        if ((t.x / TILE) % 3 === 1) {
          ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 0.8;
          ctx.beginPath();
          const crackY = t.y + 18;
          ctx.moveTo(sx + 4, crackY);
          for (let cp = sx + 10; cp < sx + t.w - 4; cp += 8) {
            ctx.lineTo(cp, crackY + (Math.random() > 0.5 ? 2 : -2));
          }
          ctx.lineTo(sx + t.w - 4, crackY + 1);
          ctx.stroke();
        }

        // Moss tufts on some block tops
        if ((t.x / TILE) % 5 === 2) {
          ctx.fillStyle = 'rgba(20,80,10,0.55)';
          const mossX = sx + 6 + ((t.x / TILE) % 7) * 5;
          ctx.beginPath(); ctx.ellipse(mossX, t.y + 1, 5, 3, 0, 0, Math.PI, true); ctx.fill();
          ctx.fillStyle = 'rgba(30,100,15,0.4)';
          ctx.beginPath(); ctx.ellipse(mossX + 8, t.y + 1, 3, 2, 0, 0, Math.PI, true); ctx.fill();
        }

        // Shadow at top
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(sx, t.y, t.w, 4);

      } else {
        // Platform stone
        const platGrad = ctx.createLinearGradient(sx, t.y, sx, t.y + t.h);
        platGrad.addColorStop(0, '#5a4a6a'); platGrad.addColorStop(1, '#2a1a3a');
        ctx.fillStyle = platGrad;
        ctx.fillRect(sx, t.y, t.w, t.h);

        // Worn edge (lighter corners)
        ctx.fillStyle = '#7a6a8a';
        ctx.fillRect(sx, t.y, t.w, 3);
        ctx.fillStyle = 'rgba(80,60,100,0.4)';
        ctx.fillRect(sx + t.w - 2, t.y, 2, t.h);

        ctx.strokeStyle = '#7a6a8a'; ctx.lineWidth = 1.5;
        ctx.strokeRect(sx + 1, t.y + 1, t.w - 2, t.h - 2);

        // Carved relief detail (arch pattern on face)
        if (t.w >= TILE * 2) {
          ctx.strokeStyle = '#3a2a4a'; ctx.lineWidth = 1;
          const midPx = sx + t.w/2;
          ctx.beginPath(); ctx.arc(midPx, t.y + t.h, t.w/4, Math.PI, 0); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(sx + 4, t.y + 5); ctx.lineTo(sx + t.w - 4, t.y + 5); ctx.stroke();
        }

        // Rope/chain hanging from some platforms
        if ((t.x / TILE) % 4 === 0) {
          ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 1;
          const rpX = sx + t.w/2;
          ctx.beginPath(); ctx.moveTo(rpX, t.y + t.h); ctx.lineTo(rpX, t.y + t.h + 18); ctx.stroke();
          for (let ri = 0; ri < 3; ri++) {
            ctx.beginPath(); ctx.arc(rpX, t.y + t.h + 4 + ri * 6, 2, 0, Math.PI*2); ctx.stroke();
          }
        }
      }
    }

    // Floor decorations: pebbles and coins between tiles
    ctx.save();
    for (let dx = 0; dx < 5000; dx += 37) {
      const dsx = dx - camX;
      if (dsx < -20 || dsx > W + 20) continue;
      const dy = 518;
      if ((dx / 37) % 3 === 0) {
        // Tiny gold coin
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = COL.goldDark;
        ctx.beginPath(); ctx.arc(dsx, dy, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = COL.gold; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.arc(dsx, dy, 2.5, 0, Math.PI*2); ctx.stroke();
      } else {
        // Pebble
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#5a4a5a';
        ctx.beginPath(); ctx.ellipse(dsx, dy, 2, 1.2, (dx % 5) * 0.3, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // Spikes
    for (const s of this.spikes) {
      const sx2 = s.x - camX;
      if (sx2 > W || sx2 + s.w < 0) continue;

      // Glowing red base pulse
      const spikePulse = 0.5 + 0.3 * Math.sin(Date.now() * 0.003);
      ctx.save();
      ctx.globalAlpha = spikePulse * 0.4;
      const spikeBaseGlow = ctx.createLinearGradient(sx2, s.y + s.h - 4, sx2, s.y + s.h);
      spikeBaseGlow.addColorStop(0, '#ff0000'); spikeBaseGlow.addColorStop(1, '#660000');
      ctx.fillStyle = spikeBaseGlow;
      ctx.fillRect(sx2, s.y + s.h - 6, s.w, 6);
      ctx.restore();

      // Chain links connecting spikes at base
      ctx.strokeStyle = '#4a3030'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(sx2, s.y + s.h - 2); ctx.lineTo(sx2 + s.w, s.y + s.h - 2); ctx.stroke();
      for (let cl = sx2 + 5; cl < sx2 + s.w - 5; cl += 8) {
        ctx.beginPath(); ctx.arc(cl, s.y + s.h - 2, 2.5, 0, Math.PI*2); ctx.stroke();
      }

      const count = Math.floor(s.w / 10);
      for (let i = 0; i < count; i++) {
        const spkX = sx2 + i * 10 + 5;
        // Serrated blade shape
        ctx.fillStyle = '#cc2200';
        ctx.shadowBlur = 4; ctx.shadowColor = '#ff4400';
        ctx.beginPath();
        ctx.moveTo(spkX - 4, s.y + s.h);
        // Left serration
        ctx.lineTo(spkX - 3, s.y + s.h * 0.3 + s.y * 0.7 + 4);
        ctx.lineTo(spkX - 2, s.y + s.h * 0.3 + s.y * 0.7 + 8);
        // Tip
        ctx.lineTo(spkX, s.y);
        // Right serration
        ctx.lineTo(spkX + 2, s.y + s.h * 0.3 + s.y * 0.7 + 8);
        ctx.lineTo(spkX + 3, s.y + s.h * 0.3 + s.y * 0.7 + 4);
        ctx.lineTo(spkX + 4, s.y + s.h);
        ctx.closePath(); ctx.fill();
        // Metal sheen
        ctx.fillStyle = 'rgba(180,180,200,0.3)';
        ctx.beginPath(); ctx.moveTo(spkX - 1, s.y + 3); ctx.lineTo(spkX + 1, s.y + 3); ctx.lineTo(spkX, s.y); ctx.closePath(); ctx.fill();
        // Dried blood on tip
        ctx.fillStyle = '#5a0000';
        ctx.beginPath(); ctx.arc(spkX, s.y + 3, 1.5, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
      }
      // Spike base
      ctx.fillStyle = '#3a0000';
      ctx.fillRect(sx2, s.y + s.h - 4, s.w, 4);
    }

    // Pressure plates
    for (const pp of this.pressurePlates) {
      const sx2 = pp.x - camX;
      ctx.fillStyle = pp.triggered ? '#cc8800' : '#887766';
      ctx.fillRect(sx2, pp.y, pp.w, 8);
      ctx.strokeStyle = pp.triggered ? COL.gold : '#aaaaaa';
      ctx.lineWidth = 1; ctx.strokeRect(sx2, pp.y, pp.w, 8);
      // Bolts at corners
      ctx.fillStyle = pp.triggered ? COL.gold : '#999';
      for (const [bx2, by2] of [[sx2+3, pp.y+3],[sx2+pp.w-3, pp.y+3],[sx2+3, pp.y+5],[sx2+pp.w-3, pp.y+5]]) {
        ctx.beginPath(); ctx.arc(bx2, by2, 1.5, 0, Math.PI*2); ctx.fill();
      }
      // Spring coils (tiny)
      ctx.strokeStyle = '#666'; ctx.lineWidth = 0.7;
      for (let sc = sx2 + 8; sc < sx2 + pp.w - 8; sc += 12) {
        ctx.beginPath(); ctx.arc(sc, pp.y + 4, 2, 0, Math.PI*2); ctx.stroke();
      }
      // Warning symbol: "!" in circle
      ctx.strokeStyle = pp.triggered ? '#ffcc00' : '#cc9900'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(sx2 + pp.w/2, pp.y + 4, 4, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = pp.triggered ? '#ffcc00' : '#cc9900';
      ctx.font = 'bold 5px Georgia'; ctx.textAlign = 'center';
      ctx.fillText('!', sx2 + pp.w/2, pp.y + 6);
    }

    // Ceiling blocks
    for (const cb of this.ceilingBlocks) {
      if (!cb.active && !cb.fallen) {
        const sx2 = cb.x - camX;
        const cbGrad = ctx.createLinearGradient(sx2, cb.y, sx2, cb.y + cb.h);
        cbGrad.addColorStop(0, '#2a1a3a'); cbGrad.addColorStop(1, '#1a1028');
        ctx.fillStyle = cbGrad;
        ctx.fillRect(sx2, cb.y, cb.w, cb.h);
        ctx.strokeStyle = '#5a4a6a'; ctx.lineWidth = 1;
        ctx.strokeRect(sx2, cb.y, cb.w, cb.h);
        // Chain links hanging from top
        ctx.strokeStyle = '#4a3a5a'; ctx.lineWidth = 1;
        for (let chi = 4; chi < cb.w - 4; chi += 12) {
          ctx.beginPath(); ctx.arc(sx2 + chi, cb.y + 4, 3, 0, Math.PI); ctx.stroke();
        }
        // Crack pattern on face
        ctx.strokeStyle = '#1a1028'; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(sx2+8, cb.y+5); ctx.lineTo(sx2+20, cb.y+15); ctx.lineTo(sx2+14, cb.y+25); ctx.stroke();
      } else if (cb.active || cb.fallen) {
        const sx2 = cb.x - camX;
        ctx.fillStyle = '#4a3a5a';
        ctx.fillRect(sx2, cb.y, cb.w, cb.h);
        ctx.strokeStyle = '#7a6a8a'; ctx.lineWidth = 1;
        ctx.strokeRect(sx2, cb.y, cb.w, cb.h);
      }
    }
  }

  drawPendulums(camX) {
    for (const p of this.pendulums) {
      const px = p.x - camX;
      const bladeX = px + Math.sin(p.angle) * p.length;
      const bladeY = p.pivotY + Math.cos(p.angle) * p.length;

      // Chain as alternating oval links
      const steps = Math.floor(p.length / 20);
      for (let li = 0; li <= steps; li++) {
        const frac = li / steps;
        const lx = px + Math.sin(p.angle) * p.length * frac;
        const ly = p.pivotY + Math.cos(p.angle) * p.length * frac;
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(p.angle + (li % 2 === 0 ? 0 : Math.PI/2));
        ctx.strokeStyle = '#667788'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(0, 0, 5, 3, 0, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }

      // Motion blur: draw blade 3 times at offset angles with decreasing alpha
      for (let mb = 2; mb >= 0; mb--) {
        ctx.save();
        ctx.globalAlpha = mb === 0 ? 1 : (mb === 1 ? 0.4 : 0.2);
        const mbAngle = p.angle + mb * 0.1 * Math.sign(Math.cos(p.timer * p.speed));
        const mbX = px + Math.sin(mbAngle) * p.length;
        const mbY = p.pivotY + Math.cos(mbAngle) * p.length;
        ctx.translate(mbX, mbY);
        ctx.rotate(mbAngle);

        // Scythe/crescent blade
        const bladeGrad = ctx.createLinearGradient(-28, -12, 28, 12);
        bladeGrad.addColorStop(0, '#556677'); bladeGrad.addColorStop(0.5, '#ffffff'); bladeGrad.addColorStop(1, '#889aaa');
        ctx.fillStyle = bladeGrad;
        ctx.shadowBlur = mb === 0 ? 8 : 0; ctx.shadowColor = 'rgba(200,220,255,0.6)';
        // Crescent shape
        ctx.beginPath();
        ctx.arc(0, 0, 26, -Math.PI*0.6, Math.PI*0.6);
        ctx.arc(0, 0, 18, Math.PI*0.6, -Math.PI*0.6, true);
        ctx.closePath(); ctx.fill();
        // Highlight lines
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(0, 0, 22, -Math.PI*0.4, Math.PI*0.4); ctx.stroke();
        // Rust spots
        ctx.fillStyle = 'rgba(100,40,20,0.4)';
        ctx.beginPath(); ctx.arc(8, 3, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(-6, -5, 2, 0, Math.PI*2); ctx.fill();
        // Blood spray near tip
        if (mb === 0) {
          ctx.fillStyle = 'rgba(140,0,0,0.5)';
          ctx.beginPath(); ctx.arc(24, 2, 2.5, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(20, -6, 1.5, 0, Math.PI*2); ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.restore();
      }

      // Pivot point
      ctx.fillStyle = '#445566';
      ctx.beginPath(); ctx.arc(px, p.pivotY, 5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#8899aa'; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  drawTorches(camX, t) {
    for (const torch of this.torches) {
      const sx = torch.x - camX;
      if (sx < -20 || sx > W + 20) continue;

      const flicker = 0.6 + 0.4 * Math.sin(t * 12 + torch.x * 0.01);
      const flicker2 = 0.5 + 0.5 * Math.sin(t * 17.3 + torch.x * 0.02 + 1.3);

      // Wider wall glow (radius 90px)
      ctx.save();
      const wallGlow = ctx.createRadialGradient(sx, torch.y, 2, sx, torch.y, 90);
      wallGlow.addColorStop(0, `rgba(255,120,0,${0.15 * flicker})`);
      wallGlow.addColorStop(0.5, `rgba(255,80,0,${0.06 * flicker})`);
      wallGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = wallGlow;
      ctx.beginPath(); ctx.arc(sx, torch.y, 90, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // Decorative iron bracket (S-curve bezier)
      ctx.strokeStyle = '#4a3a5a'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(sx - 12, torch.y + 20);
      ctx.bezierCurveTo(sx - 16, torch.y + 12, sx - 10, torch.y + 6, sx - 8, torch.y + 2);
      ctx.bezierCurveTo(sx - 6, torch.y - 4, sx - 4, torch.y - 2, sx, torch.y);
      ctx.stroke();
      // Curl at end
      ctx.beginPath(); ctx.arc(sx - 14, torch.y + 20, 3, 0, Math.PI*2); ctx.stroke();

      // Torch body
      const torchGrad = ctx.createLinearGradient(sx, torch.y, sx, torch.y + 20);
      torchGrad.addColorStop(0, '#8B6914'); torchGrad.addColorStop(1, '#5a3a00');
      ctx.fillStyle = torchGrad;
      ctx.beginPath(); ctx.roundRect(sx - 3, torch.y, 6, 20, 2); ctx.fill();

      // Multiple flame layers
      ctx.shadowBlur = 14; ctx.shadowColor = COL.torch;
      const flameH = 16 + Math.sin(t * 15 + torch.x) * 4 * flicker;

      // Outer red flame
      ctx.fillStyle = `rgba(220,40,0,${0.5 * flicker2})`;
      ctx.beginPath();
      ctx.moveTo(sx - 7, torch.y);
      ctx.bezierCurveTo(sx - 10, torch.y - flameH*0.3, sx - 3, torch.y - flameH*0.65, sx, torch.y - flameH*0.9);
      ctx.bezierCurveTo(sx + 3, torch.y - flameH*0.65, sx + 10, torch.y - flameH*0.3, sx + 7, torch.y);
      ctx.closePath(); ctx.fill();

      // Mid orange flame
      ctx.fillStyle = `rgba(255,100,0,${0.7 * flicker})`;
      ctx.beginPath();
      ctx.moveTo(sx - 5, torch.y);
      ctx.bezierCurveTo(sx - 7, torch.y - flameH*0.35, sx - 2, torch.y - flameH*0.7, sx, torch.y - flameH);
      ctx.bezierCurveTo(sx + 2, torch.y - flameH*0.7, sx + 7, torch.y - flameH*0.35, sx + 5, torch.y);
      ctx.closePath(); ctx.fill();

      // Inner bright yellow flame
      ctx.fillStyle = `rgba(255,230,50,${0.85 * flicker})`;
      ctx.beginPath();
      ctx.moveTo(sx - 3, torch.y);
      ctx.bezierCurveTo(sx - 4, torch.y - flameH*0.4, sx - 1, torch.y - flameH*0.75, sx, torch.y - flameH*1.1);
      ctx.bezierCurveTo(sx + 1, torch.y - flameH*0.75, sx + 4, torch.y - flameH*0.4, sx + 3, torch.y);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;

      // Smoke wisp
      ctx.save();
      ctx.globalAlpha = 0.12 * flicker;
      ctx.strokeStyle = '#ccbbdd';
      ctx.lineWidth = 1.5;
      const smokeT = t * 0.8 + torch.x * 0.01;
      ctx.beginPath();
      ctx.moveTo(sx, torch.y - flameH - 2);
      ctx.bezierCurveTo(sx + Math.sin(smokeT)*6, torch.y - flameH - 12, sx + Math.sin(smokeT+1)*8, torch.y - flameH - 22, sx + Math.sin(smokeT+2)*5, torch.y - flameH - 34);
      ctx.stroke();
      ctx.restore();

      // Static ember dots above flame
      for (let ed = 0; ed < 3; ed++) {
        const edX = sx + Math.sin(t * 3 + ed * 2.1 + torch.x) * 4;
        const edY = torch.y - flameH - 4 - ed * 5 - Math.sin(t * 4 + ed) * 3;
        ctx.save();
        ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 6 + ed);
        ctx.fillStyle = '#ff8800';
        ctx.beginPath(); ctx.arc(edX, edY, 1, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
  }

  drawCrystals(camX, t) {
    for (const c of this.crystals) {
      if (c.collected) continue;
      const sx = c.x - camX;
      const bob = Math.sin(t * 3) * 5;
